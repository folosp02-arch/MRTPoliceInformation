條至第三百六十條之罪，須告訴乃論。", "id": 748}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "1", "title": "第一條", "content": "為保護個人身心安全、行動自由、生活私密領域及資訊隱私，免於受到跟蹤騷擾行為侵擾，維護個人人格尊嚴，特制定本法。", "id": 749}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "2", "title": "第二條", "content": "本法所稱主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項，主管機關及目的事業主管機關應就其權責範圍，依跟蹤騷擾防制之需要，主動規劃所需保護、預防及宣導措施，對涉及相關機關之防制業務，並應全力配合。其權責如下：\n一、主管機關：負責防制政策、法規與方案之研究、規劃、訂定及解釋；\n案件之統計及公布；人員在職教育訓練；其他統籌及督導防制跟蹤騷擾行為等相關事宜。\n二、社政主管機關：跟蹤騷擾被害人保護扶助工作、配合推動跟蹤騷擾防制措施及宣導等相關事宜。\n三、衛生主管機關：跟蹤騷擾被害人身心治療、諮商及提供經法院命完成相對人治療性處遇計畫等相關事宜。\n四、教育主管機關：各級學校跟蹤騷擾防制教育之推動、跟蹤騷擾被害人就學權益維護及學校輔導諮商支持、校園跟蹤騷擾事件處理之改善等相關事宜。\n五、勞動主管機關：被害人之職業安全、職場防制教育、提供或轉介當事人身心治療及諮商等相關事宜。\n六、法務主管機關：跟蹤騷擾犯罪之偵查、矯正及再犯預防等刑事司法相關事宜。\n七、其他跟蹤騷擾行為防制措施，由相關目的事業主管機關依職權辦理。\n中央主管機關為推動前述事項應設置防制跟蹤騷擾推動諮詢小組，遴聘（派）學者專家、民間團體及相關機關代表之人數，不得少於總數二分之一，且任一性別人數不得少於總數三分之一。", "id": 750}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "3", "title": "第三條", "content": "本法所稱跟蹤騷擾行為，指以人員、車輛、工具、設備、電子通訊、網際網路或其他方法，對特定人反覆或持續為違反其意願且與性或性別有關之下列行為之一，使之心生畏怖，足以影響其日常生活或社會活動：\n一、監視、觀察、跟蹤或知悉特定人行蹤。\n二、以盯梢、守候、尾隨或其他類似方式接近特定人之住所、居所、學校、工作場所、經常出入或活動之場所。\n三、對特定人為警告、威脅、嘲弄、辱罵、歧視、仇恨、貶抑或其他相類之言語或動作。\n四、以電話、傳真、電子通訊、網際網路或其他設備，對特定人進行干擾。\n五、對特定人要求約會、聯絡或為其他追求行為。\n六、對特定人寄送、留置、展示或播送文字、圖畫、聲音、影像或其他物品。\n七、向特定人告知或出示有害其名譽之訊息或物品。\n八、濫用特定人資料或未經其同意，訂購貨品或服務。\n對特定人之配偶、直系血親、同居親屬或與特定人社會生活關係密切之人，以前項之方法反覆或持續為違反其意願而與性或性別無關之各款行為之一，使之心生畏怖，足以影響其日常生活或社會活動，亦為本法所稱跟蹤騷擾行為。", "id": 751}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "4", "title": "第四條", "content": "警察機關受理跟蹤騷擾行為案件，應即開始調查、製作書面紀錄，並告知被害人得行使之權利及服務措施。\n前項案件經調查有跟蹤騷擾行為之犯罪嫌疑者，警察機關應依職權或被害人之請求，核發書面告誡予行為人；必要時，並應採取其他保護被害人之適當措施。\n行為人或被害人對於警察機關核發或不核發書面告誡不服時，得於收受書面告誡或不核發書面告誡之通知後十日內，經原警察機關向其上級警察機關表示異議。\n前項異議，原警察機關認為有理由者，應立即更正之；認為無理由者，應於五日內加具書面理由送上級警察機關決定。上級警察機關認為有理由者，應立即更正之；認為無理由者，應予維持。\n行為人或被害人對於前項上級警察機關之決定，不得再聲明不服。", "id": 752}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "5", "title": "第五條", "content": "行為人經警察機關依前條第二項規定為書面告誡後二年內，再為跟蹤騷擾行為者，被害人得向法院聲請保護令；被害人為未成年人、身心障礙者或因故難以委任代理人者，其配偶、法定代理人、三親等內之血親或姻親，得為其向法院聲請之。\n檢察官或警察機關得依職權向法院聲請保護令。\n保護令之聲請、撤銷、變更、延長及抗告，均免徵裁判費，並準用民事訴訟法第七十七條之二十三第四項規定。\n家庭暴力防治法所定家庭成員間、現有或曾有親密關係之未同居伴侶間之跟蹤騷擾行為，應依家庭暴力防治法規定聲請民事保護令，不適用本法關於保護令之規定。", "id": 753}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "6", "title": "第六條", "content": "保護令之聲請，應以書狀為之，由被害人之住居所地、相對人之住居所地或跟蹤騷擾行為地或結果地之地方法院管轄。法院為定管轄權，得調查被害人或相對人之住居所。經聲請人或被害人要求保密被害人之住居所者，法院應以秘密方式訊問，將該筆錄及相關資料密封，並禁止閱覽。", "id": 754}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "12", "title": "第十二條", "content": "法院於審理終結後，認有跟蹤騷擾行為之事實且有必要者，應依聲請或依職權核發包括下列一款或數款之保護令：\n一、禁止相對人為第三條第一項各款行為之一，並得命相對人遠離特定場所一定距離。\n二、禁止相對人查閱被害人戶籍資料。\n三、命相對人完成治療性處遇計畫。\n四、其他為防止相對人再為跟蹤騷擾行為之必要措施。\n相對人治療性處遇計畫相關規範，由中央衛生主管機關定之。\n保護令得不記載聲請人之住所、居所及其他聯絡資訊。", "id": 755}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "17", "title": "第十七條", "content": "外國法院關於跟蹤騷擾行為之保護令，經聲請中華民國法院裁定承認後，得執行之。\n被害人或聲請權人向法院聲請承認外國法院關於跟蹤騷擾行為之保護令，有民事訴訟法第四百零二條第一項第一款至第三款所列情形之一者，法院應駁回其聲請。\n外國法院關於跟蹤騷擾行為之保護令，其核發地國對於中華民國法院之保護令不予承認者，法院得駁回其聲請。", "id": 756}, {"law": "跟蹤騷擾防制法", "chapter": "", "num": "18", "title": "第十八條", "content": "實行跟蹤騷擾行為者，處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以下罰金。\n攜帶凶器或其他危險物品犯前項之罪者，處五年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金。\n第一項之罪，須告訴乃論。\n檢察官偵查第一項之罪及司法警察官因調查犯罪情形、蒐集證據，認有調取通信紀錄及通訊使用者資料之必要時，不受通訊保障及監察法第十一條之一第一項所定最重本刑三年以上有期徒刑之罪之限制。", "id": 757}, {"law": "廢棄物清理法", "chapter": "第 二 章 一般廢棄物及應回收廢棄物之清理", "num": "27", "title": "第 27 條", "content": "在指定清除地區內嚴禁有下列行為：\n一、隨地吐痰、檳榔汁、檳榔渣，拋棄紙屑、煙蒂、口香糖、瓜果或其皮、核、汁、渣或其他一般廢棄物。\n二、污染地面、池溏、水溝、牆壁、樑柱、電桿、樹木、道路、橋樑或其他土地定著物。\n三、於路旁、屋外或屋頂曝晒、堆置有礙衛生整潔之物。\n四、自廢棄物清除、處理及貯存工具、設備或處所中搜揀經廢棄之物。但搜揀依第五條第六項所定回收項目之一般廢棄物，不在此限。\n五、拋置熱灰燼、危險化學物品或爆炸性物品於廢棄物貯存設備。\n六、棄置動物屍體於廢棄物貯存設備以外處所。\n七、隨地便溺。\n八、於水溝棄置雜物。\n九、飼養禽、畜有礙附近環境衛生。\n十、張貼或噴漆廣告污染定著物。\n十一、其他經主管機關公告之污染環境行為。", "id": 758}, {"law": "廢棄物清理法", "chapter": "第 五 章 獎勵及處罰", "num": "50", "title": "第 50 條", "content": "有下列情形之一者，處新臺幣一千二百元以上十萬元以下罰鍰，並得通知限期改善，屆期仍未完成改善者，按次處罰：\n一、不依第十一條第一款至第七款規定清除一般廢棄物。\n二、違反依第十二條第一項所定辦法有關一般廢棄物回收、清除、處理之運輸、分類、貯存、排出、方法、設備或再利用之規定；或同條第二項之分類、貯存、排出規定。\n三、為第二十七條各款行為之一。\n動力車輛駕駛人或乘客有前項第二款、第三款情形，處罰行為人或車輛所有人。但車輛所有人於執行機關或直轄市、縣（市）主管機關通知期限內檢附相關資料證明應歸責之人；或客運業於載客時已盡告知義務，乘客仍違反該規定者，車輛所有人免予處罰。", "id": 759}, {"law": "廢棄物清理法", "chapter": "第 五 章 獎勵及處罰", "num": "50-1", "title": "第 50-1 條", "content": "違反第二十七條第一款之隨地吐檳榔汁、檳榔渣之規定者，應接受四小時之戒檳班講習。\n前項戒檳班講習及其他應遵行事項之辦法，由中央主管機關定之。", "id": 760}]</script>
<script id="scenariodata" type="application/json">[{"id": "s01", "title": "旅客無票／持失效車票／冒用車票搭乘", "tag": "票務", "summary": "查獲旅客無票、車票失效或冒用不符身分之車票乘車，除補繳票價外，應加收票價 50 倍違約金；不能證明起站地點者，以公告單程票最高票價計算。屬捷運公司先行處理事項，員警於捷運公司員工要求協助或旅客拒絕配合、滋事時到場處理，必要時得依社維法或刑法相關規定處理拒不配合者。", "steps": ["請捷運站務人員先依大眾捷運法第49條向旅客補收票款及違約金。", "旅客拒絕配合、滋事或無法查證身分時，得依警職法第6、7條查證身分。", "如旅客實施第四十四條第二項前段行為（進入非供公眾通行處所）等，另涉大眾捷運法第50條，可另依大眾捷運法第50條舉發（處1,500–7,500元罰鍰）。", "持用偽造、變造車票者，依無票搭乘規定處理外，捷運公司將報請警察機關處理，必要時偵辦刑事責任。"], "refs": [59, 60, 162, 163], "script": "您好，這裡是捷運警察／站務人員。您目前查獲未持有效車票（或持失效票、冒用車票）搭乘，依大眾捷運法第49條規定，須補繳票價並支付票價50倍之違約金，請配合辦理。"}, {"id": "s02", "title": "車站／車廂內酗酒滋事、謾罵喧鬧", "tag": "秩序", "summary": "於公共場所酗酒滋事、謾罵喧鬧不聽禁止者，依社會秩序維護法可處新臺幣一萬元以下罰鍰；如已達鬥毆、施暴程度，另涉第87條。", "steps": ["先行勸阻、制止，並告知違反社會秩序維護法第72條。", "如當事人有攻擊他人、鬥毆行為，另依社維法第87條處理（處1.8萬元以下罰鍰）。", "情況激烈非管束不能預防其傷害或危害公共安全者，得依警職法第19條為管束（最長不得逾24小時）。", "現行違反社維法之行為人得依社維法第42條即時制止並逕行通知到場，不服通知者得強制到場。"], "refs": [133, 148, 175, 107], "script": "先生／小姐，您現在的行為已經影響到其他旅客，請立即停止喧嘩、辱罵行為。如果不聽勸阻，將依社會秩序維護法舉發，最高可處拘留或罰鍰。"}, {"id": "s21", "title": "月台／車廂內性騷擾（觸摸、偷拍、言語調戲）", "tag": "刑責", "summary": "以猥褻言語、舉動調戲他人，依社會秩序維護法第83條第3款處新臺幣6,000元以下罰鍰；如涉及強制觸摸等已達強制猥褻程度，構成刑法第224條（6月以上5年以下徒刑）；偷拍身體隱私部位則構成刑法第319-1條妨害性隱私罪（3年以下徒刑）。", "steps": ["立即制止行為人，優先確保被害人安全與情緒穩定，必要時陪同離開現場至安全處所。", "初步了解經過：單純言語調戲、情節輕微者，依社維法第83條舉發；涉及觸摸、偷拍等行為，應初步保全監視器畫面、目擊者資料，移送警察機關依刑法偵辦。", "尊重被害人意願處理後續，告知得提出告訴及可運用之被害人保護資源，避免二度傷害。", "如行為人對同一人有反覆跟蹤騷擾情形，另依跟蹤騷擾防制法第18條處理，並告知被害人得向法院聲請保護令。"], "refs": [144, 582, 692, 757], "script": "我是捷運警察，接獲反映您對這位旅客有不當的言語／肢體行為，請您配合到旁邊說明情況。這樣的行為可能已經觸犯社會秩序維護法或刑法相關規定，我將依規定處理。"}, {"id": "s03", "title": "月台／車廂鬥毆、互毆", "tag": "秩序", "summary": "加暴行於人、互相鬥毆或意圖鬥毆而聚眾，依社會秩序維護法第87條處新臺幣18,000元以下罰鍰；如致傷，另涉刑法傷害罪，應移送偵辦。", "steps": ["先行制止現場衝突，維護旅客安全，必要時通報捷運警察隊／轄區警察機關支援。", "依社維法第87條舉發；如涉及傷害等刑事責任，依社維法第38條移送檢察官偵辦。", "扣留具危險性之器械依警職法第21條辦理。", "依要點第四點，場站、車廂內刑案原則以轄區警察機關為管轄；捷運警察隊負責初步封鎖與蒐證。"], "refs": [148, 103, 177, 192], "script": "雙方請立即停止衝突！這裡是捷運警察，鬥毆行為已違反社會秩序維護法第87條，如未停止，將依法上銬並移送法辦，若造成他人受傷，將另涉刑法傷害罪責。"}, {"id": "s04", "title": "攜帶刀械／危險物品／易燃易爆物進站", "tag": "安全", "summary": "無正當理由攜帶具殺傷力之器械、化學製劑或危險物品，依社會秩序維護法第63條處3日以下拘留或3萬元以下罰鍰；未經許可攜帶經公告之危險或易燃物進入捷運系統，另涉大眾捷運法第50-1條（1萬至100萬元罰鍰）。", "steps": ["依警職法第7條查證身分，並依第4款檢查其身體及所攜帶之物（如有明顯事實足認攜帶足以自殺、自傷或傷害他人之物）。", "依警職法第21條扣留軍器、凶器或其他危險物品。", "分別依社會秩序維護法第63條、大眾捷運法第50-1條舉發，如涉刑法公共危險罪嫌，移送偵辦。", "旅客須知規定，捷運公司對疑似危險品得要求澄清並檢查，拒絕檢查視同攜帶危險品，將通報警察處理。"], "refs": [124, 61, 163, 177, 273], "script": "先生／小姐，您攜帶的物品經查屬管制之危險或易燃物品，依規定不得攜入捷運系統，請配合將物品寄存或移出站外，否則將依法舉發。"}, {"id": "s05", "title": "跨越軌道／月台警戒線／電扶梯逆向奔跑", "tag": "行車安全", "summary": "採完全獨立專用路權路線除天橋、地下道外不得跨越；於月台嬉戲、跨越黃色警戒線或電扶梯不按方向奔跑，依大眾捷運法第50條處1,500–7,500元罰鍰；未經天橋或地下道跨越者，依第50-1條處1萬至100萬元罰鍰。", "steps": ["立即制止並告知違反大眾捷運法第44條第3項及第50條第14款、第50-1條第1項第3款規定。", "依情節會同捷運公司站、車人員強制其離開站、車或捷運系統區域，未乘車區間票款不予退還。", "未滿14歲者違反規定，處罰其法定代理人或監護人（第50-1條第3項）。"], "refs": [49, 60, 61], "script": "請立即退回黃線後方、不要跨越軌道！這裡非常危險，隨時可能有列車通過，您的行為已違反大眾捷運法相關規定，請配合站務人員指示。"}, {"id": "s06", "title": "破壞、竊佔捷運設施或入侵資通系統", "tag": "刑責", "summary": "擅自占用或破壞捷運用地、車輛或設施，除民事回復原狀／賠償外，涉及刑責應移送偵辦；以竊取、毀壞等非法方法危害重要站場設施功能正常運作者，處1–7年有期徒刑得併科1000萬元以下罰金（第48-1條）；入侵核心資通系統者，處1–7年有期徒刑得併科1000萬元以下罰金（第48-2條），意圖危害國家安全或社會安定者加重至3–10年。", "steps": ["現場封鎖、保全跡證，通報捷運警察隊／轄區警察機關及刑事單位到場。", "依大眾捷運法第48、48-1、48-2條認定行為態樣及刑度，並移送檢察官偵辦。", "涉及資通系統入侵，另會同資安或刑事鑑識單位處理。", "如致釀成災害、致人於死或重傷，依第48-1、48-2條加重其刑。"], "refs": [56, 57, 58], "script": "這裡是捷運警察，您方才的行為已對捷運公共設施造成損害，依刑法第352條毀損罪及大眾捷運法相關規定，將對您進行舉發並要求損害賠償，請配合說明身分。"}, {"id": "s07", "title": "遊蕩、乞討、性交易拉客", "tag": "秩序", "summary": "於公共場所乞討叫化不聽勸阻，依社維法第82條處3日以下拘留或1.2萬元以下罰鍰；從事性交易或意圖性交易拉客，依第80、81條處罰（媒合性交易另處拘留併罰鍰）。", "steps": ["先行勸阻，不聽者依社維法第82條（乞討）或第80、81條（性交易／拉客）舉發。", "查證身分依警職法第6、7條辦理。", "情節輕微事實明確者，得依社維法第44條逕行處分（罰鍰以1,500元以下或申誡為限）。"], "refs": [143, 141, 142, 162, 109], "script": "先生／小姐，捷運站區內禁止乞討、拉客等行為，請立即離開本區域，否則將依社會秩序維護法舉發。"}, {"id": "s08", "title": "民眾對執勤員警謾罵、聚眾喧嘩妨礙執法", "tag": "妨害公務", "summary": "於公務員依法執行職務時，以顯然不當言詞或行動相加尚未達強暴脅迫程度，或聚眾喧嘩致礙公務進行，依社會秩序維護法第85條處拘留或1.2萬元以下罰鍰；已達強暴脅迫程度則涉刑法妨害公務罪，應移送偵辦。", "steps": ["表明身分（著制服或出示證件）並告知事由，依警職法第4條辦理。", "情節屬社維法第85條者，依法舉發；已達刑法妨害公務程度者，依社維法第38條移送檢察官。", "義務人或利害關係人得依警職法第29條當場異議，員警應依規定處理異議。"], "refs": [146, 160, 103, 185], "script": "請冷靜，您目前的言語行為已經妨礙警察依法執行職務，依刑法第135條規定屬妨害公務罪嫌，如持續下去，我將依法對您進行逮捕或舉發。"}, {"id": "s09", "title": "攔停查證身分", "tag": "警職權行使", "summary": "警察於公共場所或合法進入之場所，對合理懷疑有犯罪嫌疑之虞、對已發生或即將發生之犯罪知情、為防止具體危害有必要、滯留可疑處所或未經停居留許可等情形，得查證身分；必要時得攔停人車船、詢問姓名等資料、令出示證件，顯然無法查證身分時得帶往勤務處所（不得逾3小時並應通知親友或律師）。", "steps": ["確認查證身分之法定事由（警職法第6條各款）。", "依警職法第7條採取攔停、詢問、令出示證件等必要措施；有明顯事實足認攜帶自傷或傷人之物者，得檢查身體及攜帶物品。", "無法當場查證且符合要件者，得帶往勤務處所，時間自攔停起不得逾3小時，並向勤務指揮中心報告及通知其指定親友或律師。", "查證身分應著制服或出示證件表明身分並告知事由（第4條）；未依規定行使者，人民得拒絕。"], "refs": [162, 163, 160], "script": "您好，這裡是警察，依警察職權行使法規定，我要對您進行身分查證，請出示您的身分證明文件並配合說明。"}, {"id": "s10", "title": "管束醉漢、意圖自殺者或暴行鬥毆者", "tag": "即時強制", "summary": "警察對瘋狂或酒醉非管束不能救護其生命身體、意圖自殺、暴行鬥毆非管束不能預防傷害、或其他有危害公共安全之虞者，得為管束，最長不得逾24小時，並應即時通知家屬或適當機關人員保護。", "steps": ["確認符合警職法第19條各款管束事由。", "執行管束時得檢查受管束人身體及所攜帶之物；抗拒、攻擊或有自殺自傷之虞時，得依第20條使用警銬或戒具。", "危險或危害結束應即終止管束，並通知家屬、關係人或適當機關（構）人員保護。", "對人民實施查證身分或詢問，不得依管束規定令其供述。"], "refs": [175, 176], "script": "先生／小姐，我是警察，現在要先確認您的安全，請跟我到旁邊，我們會協助您。如果您現在無法自行照顧自己，我們將依警察職權行使法安排您到適當處所接受保護。"}, {"id": "s11", "title": "扣留危險物品／違禁品", "tag": "即時強制", "summary": "警察對軍器、凶器或其他危險物品，為預防危害之必要得扣留之；扣留應簽發清單、妥善保管，扣留期間原則不逾30日，必要時延長不逾2個月。", "steps": ["依警職法第21條扣留危險物品。", "依第22條簽發扣留物清單，載明時間、處所、名目等，加封緘妥善保管。", "無繼續扣留必要者依第24條返還所有人、持有人或保管人；符合第23條要件者得變賣。"], "refs": [177, 178, 179, 180], "script": "這項物品經查屬違禁品／危險物品，依警察職權行使法第21條規定，我將予以扣留保管，會開立扣留清單交付予您，如有異議可依法提出。"}, {"id": "s12", "title": "捷運範圍內集會、遊行活動", "tag": "轄區權責", "summary": "機場捷運系統內相關之集會、遊行事件，依集會遊行法之規定辦理；蒐證應依警職法第9條規定，於活動結束後原則銷毀所蒐集資料，但為調查犯罪或違法行為有保存必要者不在此限。", "steps": ["依集會遊行法規定辦理許可、蒐證及維持秩序等事宜。", "對參與者現場活動之攝影、錄音等資料蒐集，依警職法第9條規定辦理，活動結束後原則應銷毀。", "如涉及公共安全或秩序危害之虞，得依警職法第27、28條驅離、禁止進入或採取其他必要措施。"], "refs": [193, 165, 183, 184], "script": "這裡是捷運範圍，任何集會、遊行活動須事先申請許可，您目前的活動尚未經許可或已達影響公共秩序程度，請配合警方指示疏導，否則將依法處理。"}, {"id": "s13", "title": "捷運行車事故／意外事件處理權責", "tag": "轄區權責", "summary": "機場捷運系統內發生行車事故，由捷運警察隊負責現場封鎖管制及人、物證調查，並同步通知轄區警察機關到場採證及辦理後續事宜；必要時通知轄區警察機關刑事鑑識中心到場。", "steps": ["捷運警察隊到場後負責封鎖管制現場、進行人證物證調查。", "同步通知轄區警察機關到場採證、辦理後續相關事宜；必要時通知刑事鑑識中心。", "非營運時間發生行車事故等，由轄區警察機關先行緊急處理，捷運警察隊到場後再行接手。", "大眾捷運系統營運機構對重大行車事故應立即通報地方及中央主管機關（大眾捷運法第39條）。"], "refs": [193, 191, 43]}, {"id": "s14", "title": "刑案／社維法案件管轄劃分（場站、車廂、綠帶、站外停車場）", "tag": "轄區權責", "summary": "機場捷運系統場站、綠帶、廠站（機廠）、商場及停車場內之刑事、社會秩序維護法案件及意外事故（含道路交通事故），以轄區警察機關為管轄；移動車廂內發生之案件，以被害人下車停靠站之轄區警察機關為管轄。", "steps": ["先確認案發地點類型：場站／綠帶／停車場 → 轄區警察機關管轄；移動車廂 → 以被害人下車站之轄區警察機關管轄。", "捷運警察隊受理無嫌犯、無現場案件時，應依單一窗口規定作紀錄，並通報轄區警察機關後續處理。", "查獲現場涉案人時，捷運警察隊先行初步處理（封鎖、扣證、蒐證），再移由轄區警察機關接續偵辦。", "轄區警察機關接獲移送案件後，應將處理情形副知捷運警察隊建檔統計。", "案件管轄有爭議時，報請共同之直接上級機關決定。"], "refs": [192, 193, 196]}, {"id": "s15", "title": "捷運場站、車廂、隧道發現爆裂物", "tag": "重大事故", "summary": "機場捷運系統場站、車廂、隧道（涵管）及所屬停車場發現爆裂物時，由捷運警察隊負責現場封鎖、警戒及旅客疏散，並通知內政部警政署刑事警察局偵查第五大隊及轄區警察機關派員至現場處理。", "steps": ["立即現場封鎖、警戒，疏散旅客，通報捷運公司配合停止相關設施運作。", "通知內政部警政署刑事警察局偵查第五大隊及轄區警察機關派員處理。", "重大事故或突發事件時，向轄區警察機關通報請求支援，並受當地分局長或航空警察局保安警察大隊大隊長指揮。"], "refs": [193, 194], "script": "各位旅客請注意，為了您的安全，本站／車廂發現不明物品，請立即依站務人員指示，迅速由最近出口疏散離開，不要驚慌，請勿觸碰可疑物品。"}, {"id": "s16", "title": "旅客遺失物處理", "tag": "旅客服務", "summary": "車站、車廂內拾得遺失物，交由捷運公司詢問處或遺失物處理中心點驗處理；車站、車廂以外所有人不明之遺失物，由拾得人自行交由警察機關依法處理。", "steps": ["確認拾獲地點：車站／車廂內 → 交捷運公司詢問處或遺失物處理中心。", "車站、車廂以外（如站外、街道）拾得且所有人不明者 → 依法交由警察機關處理（適用遺失物拾得相關規定）。", "如遺失物已腐爛、產生惡臭等影響環境衛生，捷運公司得自行處理。"], "refs": [293, 294, 295, 297]}, {"id": "s17", "title": "未經許可攜帶動物進入站區／車輛", "tag": "票務", "summary": "未經許可攜帶動物進入站區或車輛內，依大眾捷運法第50條處1,500–7,500元罰鍰。動物須裝於寵物箱、寵物車、小籠或小容器內，包裝完固，每位購票旅客以攜帶1件為限；警犬、合格導盲犬、導聾犬、肢體輔助犬不在此限。", "steps": ["確認動物是否符合旅客須知規範（裝箱包裝、每人1件等）。", "違反規定者依大眾捷運法第50條第8款舉發，並得會同捷運站、車人員強制其離開。", "屬警犬或合格導盲犬、導聾犬、肢體輔助犬等，依旅客須知例外規定不受限制。"], "refs": [60, 283], "script": "先生／小姐，依規定攜帶動物進入站區或車輛須先申請許可並符合裝箱規定，請配合改用寵物箱／寵物車，或於站外等候，否則將依規定舉發。"}, {"id": "s18", "title": "現行違反社會秩序維護法行為之即時制止與逕行通知到場", "tag": "秩序", "summary": "對於現行違反社會秩序維護法之行為人，警察人員得即時制止其行為，並得逕行通知到場；其不服通知者，得強制其到場。但確悉其姓名、住所或居所而無逃亡之虞者，得改依通知程序辦理。", "steps": ["確認行為屬現行違反社會秩序維護法之行為。", "依社維法第42條即時制止行為，並逕行通知到場。", "不服通知者得強制其到場；如已確悉身分且無逃亡之虞，得依第41條通知程序辦理，給予申辯機會。", "情節輕微事實明確之案件，得依第44條不經通知、訊問逕行處分（限1,500元以下罰鍰或申誡）。"], "refs": [107, 106, 109], "script": "您目前的行為已經違反社會秩序維護法，我現在依法對您進行制止，請配合到警察機關說明，如果不服從，我將依法逕行通知或使用強制力。"}, {"id": "s19", "title": "非大眾捷運人員進入路線、隧道等非供公眾通行處所", "tag": "行車安全", "summary": "非大眾捷運系統之車輛或人員不得進入捷運系統路線、橋樑、隧道、涵管內及站區內非供公眾通行之處所；違反者依大眾捷運法第50條第3款處1,500–7,500元罰鍰。", "steps": ["制止並告知違反大眾捷運法第44條第2項及第50條第3款規定。", "查明進入動機（如追逐、輕生、竊佔等），必要時依警職法查證身分或依社維法、刑法相關規定併同處理。", "會同捷運公司站、車人員將其帶離管制區域，並確保行車安全。"], "refs": [49, 60], "script": "這裡是非供公眾通行的區域，未經許可禁止進入，已違反大眾捷運法規定，請立即退出，並配合我們了解進入原因。"}, {"id": "s20", "title": "案件管轄有爭議時的處理方式", "tag": "轄區權責", "summary": "捷運警察隊與轄區警察機關因案件管轄發生爭議時，報請共同之直接上級機關決定之。", "steps": ["先依要點第四點責任區劃分原則初步判斷管轄歸屬（場站/綠帶/停車場屬轄區警察機關；移動車廂依被害人下車站判斷）。", "如仍有爭議，報請雙方共同之直接上級機關決定管轄。"], "refs": [192, 196]}, {"id": "s22", "title": "站區／車廂內從事競選宣傳、政見發表活動", "tag": "秩序", "summary": "未經許可於捷運場站或車廂內從事競選演講、政見發表、散發宣傳品或募款等行為，依大眾捷運法第50條第1項第7款處新臺幣1,500元以上7,500元以下罰鍰；不聽勸離者，得會同警察人員強制其離開站、車或捷運系統區域。", "steps": ["確認活動是否已事先向捷運公司申請許可（依旅客須知規定，聚眾講演、散發宣傳品須經許可始得為之）。", "未經許可者，請活動人員配合停止或離開；拒絕配合，依大眾捷運法第50條第1項第7款舉發。", "如妨礙旅客通行、不聽勸離，得依同條第2項會同警察人員強制其離開站、車或捷運系統區域，其未乘車區間票款不予退還。", "如活動演變為聚眾抗爭、妨害公務或有安全疑慮，依警察職權行使法第27條、第28條排除危害，並視情節通報轄區警察機關支援。"], "refs": [60, 234, 238, 183, 184], "script": "您好，依大眾捷運法規定，於站區或車廂內從事宣傳、募款或政見發表等活動須事先申請許可，目前查無許可紀錄，請您停止活動並配合離開，否則將依法舉發。"}]</script>

/* ---------- PENALTY QUICK-REFERENCE ----------
   Reuses RELATED_GROUPS (the same curated situations used for the
   article "⇄ 比較" panel) so the two features never drift apart. */
function renderPenaltyTable(filterText){
  const q = (filterText||'').trim().toLowerCase();
  const synonyms = q ? getSynonymTerms(q) : [];
  const terms = q ? [q, ...synonyms.map(s=>s.toLowerCase())] : [];

  const matchedGroups = RELATED_GROUPS.map(g=>{
    if(!terms.length) return g;
    const labelHay = g.label.toLowerCase();
    const hitGroup = terms.some(t=>labelHay.includes(t));
    if(hitGroup) return g;
    const items = g.items.filter(it=>{
      const art = ART_BY_ID[it.id];
      const hay = (it.note + ' ' + (art? art.law+art.title : '')).toLowerCase();
      return terms.some(t=>hay.includes(t));
    });
    return items.length ? {label:g.label, items} : null;
  }).filter(Boolean);

  const wrap = document.getElementById('penaltyTable');
  if(!matchedGroups.length){
    wrap.innerHTML = `<div class="penalty-empty">找不到「${escapeHtml(filterText)}」相關的情境罰則<br>可換個關鍵字，或到「搜尋」查全部法規全文</div>`;
    return;
  }

  let html = '';
  matchedGroups.forEach(g=>{
    html += `<div class="penalty-group"><div class="penalty-group-title">${escapeHtml(g.label)}</div>`;
    g.items.forEach(it=>{
      const art = ART_BY_ID[it.id];
      if(!art) return;
      const meta = LAW_META[art.law] || {short:art.law};
      const numLabel = art.title.replace(/^第\s*/,'').replace(/\s*條$/,'').replace(/\s*點$/,'');
      html += `<div class="penalty-row" data-id="${it.id}">
        <span class="penalty-row-badge">${escapeHtml(meta.short)}${escapeHtml(numLabel)}</span>
        <span class="penalty-row-note">${escapeHtml(it.note)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.penalty-row').forEach(row=>{
    row.addEventListener('click', ()=> openArticleSheet(parseInt(row.dataset.id), ''));
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function highlight(text, terms){
  const list = (Array.isArray(terms) ? terms : [terms]).filter(Boolean);
  if(!list.length) return escapeHtml(text);
  const esc = escapeHtml(text);
  const escapedTerms = list
    .map(t=>escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))
    .filter(t=>t.length>0)
    .sort((a,b)=>b.length-a.length);
  if(!escapedTerms.length) return esc;
  try{
    return esc.replace(new RegExp(escapedTerms.join('|'),'gi'), m=>`<mark>${m}</mark>`);
  }catch(e){ return esc; }
}
function snippetAround(text, terms, len=90){
  const list = (Array.isArray(terms) ? terms : [terms]).filter(Boolean);
  if(!list.length) return text.slice(0,len);
  const lower = text.toLowerCase();
  let idx = -1;
  for(const t of list){
    idx = lower.indexOf(t.toLowerCase());
    if(idx>=0) break;
  }
  if(idx<0) return text.slice(0,len);
  const start = Math.max(0, idx-20);
  return (start>0?'…':'') + text.slice(start, start+len) + (start+len<text.length?'…':'');
}

function getSynonymTerms(q){
  const qLower = q.toLowerCase();
  const extra = new Set();
  SYNONYM_GROUPS.forEach(group=>{
    const hit = group.some(term => {
      const t = term.toLowerCase();
      return qLower.includes(t) || t.includes(qLower);
    });
    if(hit){
      group.forEach(t=>{ if(t.toLowerCase()!==qLower) extra.add(t); });
    }
  });
  return Array.from(extra);
}

let searchHistory = [];

function saveHistory(){ try{ localStorage.setItem('jw_search_history', JSON.stringify(searchHistory)); }catch(e){} }
function addToHistory(term){
  term = (term||'').trim();
  if(!term) return;
  const i = searchHistory.indexOf(term);
  if(i>=0) searchHistory.splice(i,1);
  searchHistory.unshift(term);
  if(searchHistory.length>12) searchHistory.length = 12;
  saveHistory();
}
function removeFromHistory(term){
  const i = searchHistory.indexOf(term);
  if(i>=0){ searchHistory.splice(i,1); saveHistory(); }
}

function runSearch(){
  const q = searchInput.value.trim();
  searchbarEl.classList.toggle('has-text', q.length>0);

  let pool = ARTICLES;
  if(activeLawFilter !== 'all'){
    pool = pool.filter(a=>a.law===activeLawFilter);
  }

  if(!q){
    if(activeLawFilter==='all'){
      renderEmptyState();
      return;
    }
    // show all of that law's articles, grouped simply
    renderArticleList(pool.slice(0,60).map(a=>({a, terms:[], synonym:null})), '');
    return;
  }

  const qLower = q.toLowerCase();
  const synonyms = getSynonymTerms(q);

  const scored = pool.map(a=>{
    const hay = (a.title + ' ' + a.content).toLowerCase();
    const foundTerms = [];
    let score = -1;
    let synonymUsed = null;
    if(hay.includes(qLower)){
      score = a.title.toLowerCase().includes(qLower) ? 3 : 2;
      foundTerms.push(q);
    }
    synonyms.forEach(syn=>{
      const synLower = syn.toLowerCase();
      if(hay.includes(synLower)){
        foundTerms.push(syn);
        if(score < 0){
          score = a.title.toLowerCase().includes(synLower) ? 1.5 : 1;
        }
        if(!synonymUsed) synonymUsed = syn;
      }
    });
    return {a, score, terms:foundTerms, synonym:(score<2 ? synonymUsed : null)};
  }).filter(x=>x.score>=0).sort((x,y)=>y.score-x.score);

  if(scored.length===0){
    resultsWrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">🗂️</div>
        <p>找不到「${escapeHtml(q)}」相關條文<br>可換個關鍵字，或至「情境快答」查看常見情況</p>
      </div>`;
    return;
  }
  renderArticleList(scored, q);
}

function renderArticleList(list, q){
  let html = `<div class="section-label">${q? `搜尋結果　共 ${list.length} 筆` : `共 ${list.length} 筆條文`}</div><div class="art-list">`;
  list.forEach(item=>{
    const a = item.a;
    const terms = (item.terms && item.terms.length) ? item.terms : (q ? [q] : []);
    const meta = LAW_META[a.law] || {short:a.law, dot:'dot-mrt'};
    html += `
      <div class="art-card" data-id="${a.id}" data-terms="${escapeAttr(terms.join('|'))}">
        <div class="art-top">
          <span class="lawdot ${meta.dot}"></span>
          <span class="art-lawname">${escapeHtml(meta.short)}${a.chapter? ' · '+escapeHtml(a.chapter.replace(/^第\s*/,'').replace(/\s*章$/,'').replace(/\s*編$/,'')) : ''}</span>
          <span class="art-num">${escapeHtml(a.title)}</span>
        </div>
        ${item.synonym ? `<div class="synonym-badge">💡 同義詞相關：${escapeHtml(item.synonym)}</div>` : ''}
        <div class="art-snippet">${highlight(snippetAround(a.content, terms), terms)}</div>
      </div>`;
  });
  html += `</div>`;
  resultsWrap.innerHTML = html;
  resultsWrap.querySelectorAll('.art-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const terms = el.dataset.terms ? el.dataset.terms.split('|').filter(Boolean) : [];
      openArticleSheet(parseInt(el.dataset.id), terms);
    });
  });
}

        <div class="tagrow"><span class="tagpill">${escapeHtml(s.tag)}</span></div>
        <h3>${escapeHtml(s.title)}</h3>
        <p class="desc">${escapeHtml(s.summary)}</p>
        <span class="chev">›</span>
      </div>`;
  });
  scenarioGrid.innerHTML = html;
  scenarioGrid.querySelectorAll('.scenario-card').forEach(el=>{
    el.addEventListener('click', ()=>openScenarioSheet(el.dataset.id));
  });
}
renderScenarios();

/* ---------- BROWSE VIEW ---------- */
const lawGroupsEl = document.getElementById('lawGroups');
function renderBrowse(){
  let html = '';
  LAW_ORDER.forEach(law=>{
    const meta = LAW_META[law];
    const arts = ARTICLES.filter(a=>a.law===law);
    // group by chapter preserving order of first appearance
    const chapters = [];
    const chapMap = {};
    arts.forEach(a=>{
      const key = a.chapter || '';
      if(!(key in chapMap)){ chapMap[key]=[]; chapters.push(key); }
      chapMap[key].push(a);
    });
    html += `<div class="law-group" data-law="${escapeAttr(law)}">
      <div class="law-group-head">
        <div class="law-icon ${meta.icon}">${meta.emoji}</div>
        <div class="info">
          <h3>${escapeHtml(law)}</h3>
          <div class="cnt">${arts.length} 則條文・展開後可直接閱讀全文</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="law-group-body">`;
    chapters.forEach(ch=>{
      html += `<div class="chapter-block">`;
      if(ch) html += `<div class="chapter-title">${escapeHtml(ch)}</div>`;
      chapMap[ch].forEach(a=>{
        const numLabel = a.title.replace(/^第\s*/,'').replace(/\s*條$/,'').replace(/\s*點$/,'');
        html += `<div class="full-art" data-id="${a.id}">
          <div class="full-art-head" data-openid="${a.id}">
            <span class="full-art-num">${escapeHtml(numLabel)}</span>
            <span class="full-art-expand">開啟詳情 ›</span>
            <span class="full-art-star ${isFav(a.id)?'active':''}" data-starid="${a.id}">${isFav(a.id)?'★':'☆'}</span>
          </div>
          <div class="full-art-content" data-openid="${a.id}">${escapeHtml(a.content)}</div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  lawGroupsEl.innerHTML = html;

  lawGroupsEl.querySelectorAll('.law-group-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      head.parentElement.classList.toggle('open');
    });
  });
  lawGroupsEl.querySelectorAll('[data-openid]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openArticleSheet(parseInt(el.dataset.openid), '');
    });
  });
  lawGroupsEl.querySelectorAll('[data-starid]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const id = parseInt(el.dataset.starid);
      toggleFav(id);
      el.classList.toggle('active', isFav(id));
      el.textContent = isFav(id) ? '★' : '☆';
      if(views.fav.classList.contains('active')) renderFavs();
    });
  });
}
renderBrowse();

/* ---------- FAVORITES VIEW ---------- */
const favListEl = document.getElementById('favList');
function renderFavs(){
  if(favorites.length===0){
    favListEl.innerHTML = `
      <div class="fav-empty">
        <div class="icon">☆</div>
        <p>尚未收藏條文<br>瀏覽條文時點右上角「☆」即可加入收藏，<br>方便執勤時快速查閱</p>
      </div>`;
    return;
  }
  const list = favorites.map(id=>ART_BY_ID[id]).filter(Boolean);
  renderInto(favListEl, list);
}
function renderInto(container, list){
  let html = `<div class="art-list">`;
  list.forEach(a=>{
    const meta = LAW_META[a.law] || {short:a.law, dot:'dot-mrt'};
    html += `
      <div class="art-card" data-id="${a.id}">
        <div class="art-top">
          <span class="lawdot ${meta.dot}"></span>
          <span class="art-lawname">${escapeHtml(meta.short)}</span>
          <span class="art-num">${escapeHtml(a.title)}</span>
        </div>
        <div class="art-title" style="margin-top:6px;">${escapeHtml(a.content.split('\n')[0]).slice(0,60)}</div>
      </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.art-card').forEach(el=>{
    el.addEventListener('click', ()=>openArticleSheet(parseInt(el.dataset.id), ''));
  });
}

/* ---------- SHEET (article / scenario detail) ---------- */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetLawname = document.getElementById('sheetLawname');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBody = document.getElementById('sheetBody');
const sheetFavBtn = document.getElementById('sheetFavBtn');
const sheetClose = document.getElementById('sheetClose');

let currentSheetArticleId = null;
let currentShareData = null;

function buildCompareHtml(id){
  const groups = RELATED_BY_ID[id];
  if(!groups || !groups.length) return '';
  const seen = new Set();
  let html = '';
  groups.forEach(g=>{
    if(seen.has(g.label)) return;
    seen.add(g.label);
    html += `<div class="compare-label">⇄ 比較：${escapeHtml(g.label)}</div><div class="compare-list">`;
    g.items.forEach(it=>{
      const art = ART_BY_ID[it.id];
      if(!art) return;
      const meta = LAW_META[art.law] || {short:art.law};
      const isCurrent = it.id === id;
      html += `<div class="compare-item${isCurrent?' is-current':''}" data-id="${it.id}">
        <div class="compare-item-head">
          <span class="compare-lawname">${escapeHtml(meta.short)}</span>
          <span class="compare-title">${escapeHtml(art.title)}</span>
          ${isCurrent? `<span class="compare-current-tag">本條</span>` : ''}
        </div>
        <div class="compare-note">${escapeHtml(it.note)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function openArticleSheet(id, q){
  const a = ART_BY_ID[id];
  if(!a) return;
  currentSheetArticleId = id;
  const meta = LAW_META[a.law] || {short:a.law};
  sheetLawname.textContent = `${meta.short}${a.chapter? ' · '+a.chapter : ''}`;
  sheetTitle.innerHTML = highlight(a.title, q);
  sheetBody.innerHTML = `<div class="content">${highlight(a.content, q)}</div>${buildCompareHtml(id)}`;
  sheetFavBtn.style.display = 'flex';
  sheetFavBtn.classList.toggle('active', isFav(id));
  sheetFavBtn.textContent = isFav(id) ? '★' : '☆';
  currentShareData = {
    title: `${a.law} ${a.title}`,
    text: `【捷警法規快查】${a.law}${a.chapter? ' '+a.chapter:''} ${a.title}\n\n${a.content}\n\n—— 內容來源：捷警法規快查`
  };
  sheetBody.querySelectorAll('.compare-item:not(.is-current)').forEach(el=>{
    el.addEventListener('click', ()=> openArticleSheet(parseInt(el.dataset.id), ''));
  });
  showSheet();
}

function openScenarioSheet(sid){
  const s = SCENARIOS.find(x=>x.id===sid);
  if(!s) return;
  currentSheetArticleId = null;
  sheetLawname.textContent = s.tag + ' · 情境快答';
  sheetTitle.textContent = s.title;
  sheetFavBtn.style.display = 'none';

  let html = `<div class="scenario-detail">
    <div class="summary">${escapeHtml(s.summary)}</div>`;
  if(s.script){
    html += `<div class="script-card">
      <div class="script-head">
        <span class="script-label">🗣️ 舉發用語小抄</span>
        <span class="script-copy" id="scriptCopyBtn">複製</span>
      </div>
      <div class="script-text">${escapeHtml(s.script)}</div>
    </div>`;
  }
  html += `<ol class="steps">`;
  s.steps.forEach(st=> html += `<li>${escapeHtml(st)}</li>`);
  html += `</ol>`;
  let shareRefLines = [];
  if(s.refs && s.refs.length){
    html += `<div class="reflist-label">相關條文</div><div class="ref-chip-list">`;
    s.refs.forEach(rid=>{
      const a = ART_BY_ID[rid];
      if(!a) return;
      const meta = LAW_META[a.law] || {short:a.law};
      html += `<div class="ref-chip" data-id="${a.id}">
        <span class="n">${escapeHtml(meta.short)}</span>
        <span class="t">${escapeHtml(a.title)} — ${escapeHtml(a.content.split('\n')[0]).slice(0,26)}</span>
        <span class="go">›</span>
      </div>`;
      shareRefLines.push(`．${meta.short}${a.title}`);
    });
    html += `</div>`;
  }
  html += `</div>`;
  sheetBody.innerHTML = html;
  if(s.script){
    document.getElementById('scriptCopyBtn').addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      try{
        await navigator.clipboard.writeText(s.script);
        showToast('已複製舉發用語');
      }catch(e){
        showToast('複製失敗，請手動選取內容');
      }
    });
  }
  const stepsText = s.steps.map((st,i)=>`${i+1}. ${st}`).join('\n');
  currentShareData = {
    title: s.title,
    text: `【捷警法規快查・情境快答】${s.title}\n\n${s.summary}` +
      (s.script? `\n\n舉發用語：\n${s.script}` : '') +
      `\n\n處理步驟：\n${stepsText}` +
      (shareRefLines.length? `\n\n相關條文：\n${shareRefLines.join('\n')}` : '') +
      `\n\n—— 內容來源：捷警法規快查`
  };
  sheetBody.querySelectorAll('.ref-chip').forEach(el=>{
    el.addEventListener('click', ()=> openArticleSheet(parseInt(el.dataset.id), ''));
  });
  showSheet();
}

function showSheet(){
  backdrop.classList.add('show');
  sheet.classList.add('show');
  sheetBody.scrollTop = 0;
}
function hideSheet(){
  backdrop.classList.remove('show');
  sheet.classList.remove('show');
}
backdrop.addEventListener('click', hideSheet);
sheetClose.addEventListener('click', hideSheet);
sheetFavBtn.addEventListener('click', ()=>{
  if(currentSheetArticleId===null) return;
  toggleFav(currentSheetArticleId);
  sheetFavBtn.classList.toggle('active', isFav(currentSheetArticleId));
  sheetFavBtn.textContent = isFav(currentSheetArticleId) ? '★' : '☆';
  if(document.getElementById('view-fav').classList.contains('active')) renderFavs();
});

/* ---------- SHARE ---------- */
const sheetShareBtn = document.getElementById('sheetShareBtn');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}
async function shareCurrentSheet(){
  if(!currentShareData) return;
  const { title, text } = currentShareData;
  if(navigator.share){
    try{
      await navigator.share({ title, text });
    }catch(e){
      /* user cancelled the native share sheet — no action needed */
    }
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('已複製到剪貼簿');
  }catch(e){
    showToast('複製失敗，請手動選取內容');
  }
}
sheetShareBtn.addEventListener('click', shareCurrentSheet);

/* ---------- THEME TOGGLE ---------- */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
  try{ localStorage.setItem('jw_theme', theme); }catch(e){}
}
let savedTheme = 'light';
try{ savedTheme = localStorage.getItem('jw_theme') || 'light'; }catch(e){ savedTheme = 'light'; }
applyTheme(savedTheme);
themeToggle.addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
});

   Edit this block to publish a new announcement. Give each new message
   a NEW unique `id` (e.g. bump the date) — that's what makes it pop up

   Set `enabled: false` to turn the whole feature off (hides the icon too). */
const ANNOUNCEMENT = {
  enabled: true,
  id: 'ann-2026-08-20',
  title: '公告',
  date: '2026/08/20',
  body: '歡迎使用捷警法規快查！\n本頁面持續更新中，如發現條文有誤或有想新增的功能，歡迎隨時反映。'
};

const announceBtn = document.getElementById('announceBtn');

const announceOkBtn = document.getElementById('announceOkBtn');

function showAnnouncement(){
  document.getElementById('announceTitle').textContent = ANNOUNCEMENT.title;
  document.getElementById('announceDate').textContent = ANNOUNCEMENT.date;
  document.getElementById('announceBody').textContent = ANNOUNCEMENT.body;
  announceBackdrop.classList.add('show');
  announceModal.classList.add('show');
}
function hideAnnouncement(markSeen){
  announceBackdrop.classList.remove('show');
  announceModal.classList.remove('show');
  if(markSeen){
    try{ localStorage.setItem('jw_seen_announcement', ANNOUNCEMENT.id); }catch(e){}
    announceBtn.classList.remove('has-new');
  }
}
function initAnnouncement(){
  if(!ANNOUNCEMENT.enabled) return;
  announceBtn.style.display = 'flex';
  let seenId = null;
  try{ seenId = localStorage.getItem('jw_seen_announcement'); }catch(e){}
  const isNew = seenId !== ANNOUNCEMENT.id;
  if(isNew){
    announceBtn.classList.add('has-new');
    showAnnouncement();
  }
}
announceOkBtn.addEventListener('click', ()=>hideAnnouncement(true));
announceBackdrop.addEventListener('click', ()=>hideAnnouncement(true));
announceBtn.addEventListener('click', ()=>showAnnouncement());

例外規定不受限制。"], "refs": [60, 283]}, {"id": "s18", "title": "現行違反社會秩序維護法行為之即時制止與逕行通知到場", "tag": "秩序", "summary": "對於現行違反社會秩序維護法之行為人，警察人員得即時制止其行為，並得逕行通知到場；其不服通知者，得強制其到場。但確悉其姓名、住所或居所而無逃亡之虞者，得改依通知程序辦理。", "steps": ["確認行為屬現行違反社會秩序維護法之行為。", "依社維法第42條即時制止行為，並逕行通知到場。", "不服通知者得強制其到場；如已確悉身分且無逃亡之虞，得依第41條通知程序辦理，給予申辯機會。", "情節輕微事實明確之案件，得依第44條不經通知、訊問逕行處分（限1,500元以下罰鍰或申誡）。"], "refs": [107, 106, 109]}, {"id": "s19", "title": "非大眾捷運人員進入路線、隧道等非供公眾通行處所", "tag": "行車安全", "summary": "非大眾捷運系統之車輛或人員不得進入捷運系統路線、橋樑、隧道、涵管內及站區內非供公眾通行之處所；違反者依大眾捷運法第50條第3款處1,500–7,500元罰鍰。", "steps": ["制止並告知違反大眾捷運法第44條第2項及第50條第3款規定。", "查明進入動機（如追逐、輕生、竊佔等），必要時依警職法查證身分或依社維法、刑法相關規定併同處理。", "會同捷運公司站、車人員將其帶離管制區域，並確保行車安全。"], "refs": [49, 60]}, {"id": "s20", "title": "案件管轄有爭議時的處理方式", "tag": "轄區權責", "summary": "捷運警察隊與轄區警察機關因案件管轄發生爭議時，報請共同之直接上級機關決定之。", "steps": ["先依要點第四點責任區劃分原則初步判斷管轄歸屬（場站/綠帶/停車場屬轄區警察機關；移動車廂依被害人下車站判斷）。", "如仍有爭議，報請雙方共同之直接上級機關決定管轄。"], "refs": [192, 196]}]</script>

<script>
const ARTICLES = JSON.parse(document.getElementById('lawdata').textContent);
const SCENARIOS = JSON.parse(document.getElementById('scenariodata').textContent);
const ART_BY_ID = {};
ARTICLES.forEach(a => ART_BY_ID[a.id] = a);

const LAW_META = {
  '大眾捷運法':        {short:'捷運法', dot:'dot-mrt', icon:'mrt', emoji:'🚇'},
  '社會秩序維護法':      {short:'社維法', dot:'dot-sw',  icon:'sw',  emoji:'⚖️'},
  '警察職權行使法':      {short:'警職法', dot:'dot-pj',  icon:'pj',  emoji:'🛡️'},
  '桃園市政府警察局捷運警察隊與轄區警察機關權責劃分及聯繫要點': {short:'轄區要點', dot:'dot-yd', icon:'yd', emoji:'🗺️'},
  '桃園大眾捷運系統旅客須知': {short:'旅客須知', dot:'dot-xz', icon:'xz', emoji:'🎫'},
};
const LAW_ORDER = ['大眾捷運法','社會秩序維護法','警察職權行使法','桃園市政府警察局捷運警察隊與轄區警察機關權責劃分及聯繫要點','桃園大眾捷運系統旅客須知'];

let activeLawFilter = 'all';
let favorites = [];
try{ favorites = JSON.parse(localStorage.getItem('jw_favorites')||'[]'); }catch(e){ favorites = []; }
function saveFavs(){ localStorage.setItem('jw_favorites', JSON.stringify(favorites)); }
function isFav(id){ return favorites.includes(id); }
function toggleFav(id){
  const i = favorites.indexOf(id);
  if(i>=0) favorites.splice(i,1); else favorites.unshift(id);
  saveFavs();
}

/* ---------- lawfilters chips ---------- */
const lawfiltersEl = document.getElementById('lawfilters');
function renderChips(){
  let html = `<div class="chip ${activeLawFilter==='all'?'active':''}" data-law="all">全部</div>`;
  LAW_ORDER.forEach(law=>{
    const m = LAW_META[law];
    html += `<div class="chip ${activeLawFilter===law?'active':''}" data-law="${escapeAttr(law)}">${m.short}</div>`;
  });
  lawfiltersEl.innerHTML = html;
  lawfiltersEl.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      activeLawFilter = c.dataset.law;
      renderChips();
      runSearch();
    });
  });
}
renderChips();

/* ---------- helpers ---------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const qEsc = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{
    return esc.replace(new RegExp(qEsc,'gi'), m=>`<mark>${m}</mark>`);
  }catch(e){ return esc; }
}
function snippetAround(text, q, len=90){
  if(!q) return text.slice(0,len);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return text.slice(0,len);
  const start = Math.max(0, idx-20);
  return (start>0?'…':'') + text.slice(start, start+len) + (start+len<text.length?'…':'');
}

/* ---------- SEARCH VIEW ---------- */
const searchInput = document.getElementById('searchInput');
const searchbarEl = document.getElementById('searchbar');
const clearBtn = document.getElementById('clearBtn');
const resultsWrap = document.getElementById('searchResultsWrap');

function runSearch(){
  const q = searchInput.value.trim();
  searchbarEl.classList.toggle('has-text', q.length>0);

  let pool = ARTICLES;
  if(activeLawFilter !== 'all'){
    pool = pool.filter(a=>a.law===activeLawFilter);
  }

  if(!q){
    if(activeLawFilter==='all'){
      resultsWrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔎</div>
          <p>輸入關鍵字搜尋 5 部法規／要點全文<br>例如「無票」「查證身分」「扣留」「爆裂物」「管轄」</p>
        </div>`;
      return;
    }
    // show all of that law's articles, grouped simply
    renderArticleList(pool.slice(0,60), '');
    return;
  }

  const qLower = q.toLowerCase();
  const scored = pool.map(a=>{
    const hay = (a.title + ' ' + a.content).toLowerCase();
    let score = -1;
    if(hay.includes(qLower)){
      score = a.title.toLowerCase().includes(qLower) ? 2 : 1;
    }
    return {a, score};
  }).filter(x=>x.score>=0).sort((x,y)=>y.score-x.score);

  if(scored.length===0){
    resultsWrap.innerHTML = `
      <div class="empty-state">
        <div class="icon">🗂️</div>
        <p>找不到「${escapeHtml(q)}」相關條文<br>可換個關鍵字，或至「情境快答」查看常見情況</p>
      </div>`;
    return;
  }
  renderArticleList(scored.map(x=>x.a), q);
}

function renderArticleList(list, q){
  let html = `<div class="section-label">${q? `搜尋結果　共 ${list.length} 筆` : `共 ${list.length} 筆條文`}</div><div class="art-list">`;
  list.forEach(a=>{
    const meta = LAW_META[a.law] || {short:a.law, dot:'dot-mrt'};
    html += `
      <div class="art-card" data-id="${a.id}">
        <div class="art-top">
          <span class="lawdot ${meta.dot}"></span>
          <span class="art-lawname">${escapeHtml(meta.short)}${a.chapter? ' · '+escapeHtml(a.chapter.replace(/^第\s*/,'').replace(/\s*章$/,'').replace(/\s*編$/,'')) : ''}</span>
          <span class="art-num">${escapeHtml(a.title)}</span>
        </div>
        <div class="art-snippet">${highlight(snippetAround(a.content, q), q)}</div>
      </div>`;
  });
  html += `</div>`;
  resultsWrap.innerHTML = html;
  resultsWrap.querySelectorAll('.art-card').forEach(el=>{
    el.addEventListener('click', ()=>openArticleSheet(parseInt(el.dataset.id), q));
  });
}

searchInput.addEventListener('input', runSearch);
clearBtn.addEventListener('click', ()=>{ searchInput.value=''; runSearch(); searchInput.focus(); });

/* ---------- SCENARIO VIEW ---------- */
const scenarioGrid = document.getElementById('scenarioGrid');
function renderScenarios(){
  let html = '';
  SCENARIOS.forEach(s=>{
    html += `
      <div class="scenario-card" data-id="${s.id}">
        <div class="tagrow"><span class="tagpill">${escapeHtml(s.tag)}</span></div>
        <h3>${escapeHtml(s.title)}</h3>
        <p class="desc">${escapeHtml(s.summary)}</p>
        <span class="chev">›</span>
      </div>`;
  });
  scenarioGrid.innerHTML = html;
  scenarioGrid.querySelectorAll('.scenario-card').forEach(el=>{
    el.addEventListener('click', ()=>openScenarioSheet(el.dataset.id));
  });
}
renderScenarios();

/* ---------- BROWSE VIEW ---------- */
const lawGroupsEl = document.getElementById('lawGroups');
function renderBrowse(){
  let html = '';
  LAW_ORDER.forEach(law=>{
    const meta = LAW_META[law];
    const arts = ARTICLES.filter(a=>a.law===law);
    // group by chapter preserving order of first appearance
    const chapters = [];
    const chapMap = {};
    arts.forEach(a=>{
      const key = a.chapter || '';
      if(!(key in chapMap)){ chapMap[key]=[]; chapters.push(key); }
      chapMap[key].push(a);
    });
    html += `<div class="law-group" data-law="${escapeAttr(law)}">
      <div class="law-group-head">
        <div class="law-icon ${meta.icon}">${meta.emoji}</div>
        <div class="info">
          <h3>${escapeHtml(law)}</h3>
          <div class="cnt">${arts.length} 則條文</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="law-group-body">`;
    chapters.forEach(ch=>{
      html += `<div class="chapter-block">`;
      if(ch) html += `<div class="chapter-title">${escapeHtml(ch)}</div>`;
      chapMap[ch].forEach(a=>{
        html += `<div class="mini-art" data-id="${a.id}">
          <span class="n">${escapeHtml(a.title.replace(/^第\s*/,'').replace(/\s*條$/,'').replace(/\s*點$/,''))}</span>
          <span class="t">${escapeHtml(a.content.split('\n')[0])}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  lawGroupsEl.innerHTML = html;

  lawGroupsEl.querySelectorAll('.law-group-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      head.parentElement.classList.toggle('open');
    });
  });
  lawGroupsEl.querySelectorAll('.mini-art').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openArticleSheet(parseInt(el.dataset.id), '');
    });
  });
}
renderBrowse();

/* ---------- FAVORITES VIEW ---------- */
const favListEl = document.getElementById('favList');
function renderFavs(){
  if(favorites.length===0){
    favListEl.innerHTML = `
      <div class="fav-empty">
        <div class="icon">☆</div>
        <p>尚未收藏條文<br>瀏覽條文時點右上角「☆」即可加入收藏，<br>方便執勤時快速查閱</p>
      </div>`;
    return;
  }
  const list = favorites.map(id=>ART_BY_ID[id]).filter(Boolean);
  renderInto(favListEl, list);
}
function renderInto(container, list){
  let html = `<div class="art-list">`;
  list.forEach(a=>{
    const meta = LAW_META[a.law] || {short:a.law, dot:'dot-mrt'};
    html += `
      <div class="art-card" data-id="${a.id}">
        <div class="art-top">
          <span class="lawdot ${meta.dot}"></span>
          <span class="art-lawname">${escapeHtml(meta.short)}</span>
          <span class="art-num">${escapeHtml(a.title)}</span>
        </div>
        <div class="art-title" style="margin-top:6px;">${escapeHtml(a.content.split('\n')[0]).slice(0,60)}</div>
      </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
  container.querySelectorAll('.art-card').forEach(el=>{
    el.addEventListener('click', ()=>openArticleSheet(parseInt(el.dataset.id), ''));
  });
}

/* ---------- SHEET (article / scenario detail) ---------- */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetLawname = document.getElementById('sheetLawname');
const sheetTitle = document.getElementById('sheetTitle');
const sheetBody = document.getElementById('sheetBody');
const sheetFavBtn = document.getElementById('sheetFavBtn');
const sheetClose = document.getElementById('sheetClose');

let currentSheetArticleId = null;

function openArticleSheet(id, q){
  const a = ART_BY_ID[id];
  if(!a) return;
  currentSheetArticleId = id;
  const meta = LAW_META[a.law] || {short:a.law};
  sheetLawname.textContent = `${meta.short}${a.chapter? ' · '+a.chapter : ''}`;
  sheetTitle.innerHTML = highlight(a.title, q);
  sheetBody.innerHTML = `<div class="content">${highlight(a.content, q)}</div>`;
  sheetFavBtn.style.display = 'flex';
  sheetFavBtn.classList.toggle('active', isFav(id));
  sheetFavBtn.textContent = isFav(id) ? '★' : '☆';
  showSheet();
}

function openScenarioSheet(sid){
  const s = SCENARIOS.find(x=>x.id===sid);
  if(!s) return;
  currentSheetArticleId = null;
  sheetLawname.textContent = s.tag + ' · 情境快答';
  sheetTitle.textContent = s.title;
  sheetFavBtn.style.display = 'none';

  let html = `<div class="scenario-detail">
    <div class="summary">${escapeHtml(s.summary)}</div>
    <ol class="steps">`;
  s.steps.forEach(st=> html += `<li>${escapeHtml(st)}</li>`);
  html += `</ol>`;
  if(s.refs && s.refs.length){
    html += `<div class="reflist-label">相關條文</div><div class="ref-chip-list">`;
    s.refs.forEach(rid=>{
      const a = ART_BY_ID[rid];
      if(!a) return;
      const meta = LAW_META[a.law] || {short:a.law};
      html += `<div class="ref-chip" data-id="${a.id}">
        <span class="n">${escapeHtml(meta.short)}</span>
        <span class="t">${escapeHtml(a.title)} — ${escapeHtml(a.content.split('\n')[0]).slice(0,26)}</span>
        <span class="go">›</span>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  sheetBody.innerHTML = html;
  sheetBody.querySelectorAll('.ref-chip').forEach(el=>{
    el.addEventListener('click', ()=> openArticleSheet(parseInt(el.dataset.id), ''));
  });
  showSheet();
}

function showSheet(){
  backdrop.classList.add('show');
  sheet.classList.add('show');
  sheetBody.scrollTop = 0;
}
function hideSheet(){
  backdrop.classList.remove('show');
  sheet.classList.remove('show');
}
backdrop.addEventListener('click', hideSheet);
sheetClose.addEventListener('click', hideSheet);
sheetFavBtn.addEventListener('click', ()=>{
  if(currentSheetArticleId===null) return;
  toggleFav(currentSheetArticleId);
  sheetFavBtn.classList.toggle('active', isFav(currentSheetArticleId));
  sheetFavBtn.textContent = isFav(currentSheetArticleId) ? '★' : '☆';
  if(document.getElementById('view-fav').classList.contains('active')) renderFavs();
});

/* ---------- TAB NAV ---------- */
const tabButtons = document.querySelectorAll('nav.tabbar button');
const views = {
  search: document.getElementById('view-search'),
  scenario: document.getElementById('view-scenario'),
  browse: document.getElementById('view-browse'),
  fav: document.getElementById('view-fav'),
};
tabButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tabButtons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    Object.values(views).forEach(v=>v.classList.remove('active'));
    const key = btn.dataset.view;
    views[key].classList.add('active');
    document.getElementById('mainScroll').scrollTop = 0;
    if(key==='fav') renderFavs();
  });
});

/* init */
views.search.classList.add('active');
runSearch();
</script>

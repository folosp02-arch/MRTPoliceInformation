: "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "16", "title": "第 16 條", "content": "除有正當理由而無法避免者外，不得因不知法律而免除刑事責任。但按其情節，得減輕其刑。", "id": 342}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "17", "title": "第 17 條", "content": "因犯罪致發生一定之結果，而有加重其刑之規定者，如行為人不能預見其發生時，不適用之。", "id": 343}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "18", "title": "第 18 條", "content": "1 未滿十四歲人之行為，不罰。\n2 十四歲以上未滿十八歲人之行為，得減輕其刑。\n3 滿八十歲人之行為，得減輕其刑。", "id": 344}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "19", "title": "第 19 條", "content": "1 行為時因精神障礙或其他心智缺陷，致不能辨識其行為違法或欠缺依其辨識而行為之能力者，不罰。\n2 行為時因前項之原因，致其辨識行為違法或依其辨識而行為之能力，顯著減低者，得減輕其刑。\n3 前二項規定，於因故意或過失自行招致者，不適用之。", "id": 345}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "20", "title": "第 20 條", "content": "瘖啞人之行為，得減輕其刑。", "id": 346}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "21", "title": "第 21 條", "content": "1 依法令之行為，不罰。\n2 依所屬上級公務員命令之職務上行為，不罰。但明知命令違法者，不在此限。", "id": 347}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "22", "title": "第 22 條", "content": "業務上之正當行為，不罰。", "id": 348}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "23", "title": "第 23 條", "content": "對於現在不法之侵害，而出於防衛自己或他人權利之行為，不罰。但防衛行為過當者，得減輕或免除其刑。", "id": 349}, {"law": "中華民國刑法", "chapter": "第 二 章 刑事責任", "num": "24", "title": "第 24 條", "content": "1 因避免自己或他人生命、身體、自由、財產之緊急危難而出於不得已之行為，不罰。但避難行為過當者，得減輕或免除其刑。\n2 前項關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之。", "id": 350}, {"law": "中華民國刑法", "chapter": "第 三 章 未遂犯", "num": "25", "title": "第 25 條", "content": "1 已著手於犯罪行為之實行而不遂者，為未遂犯。\n2 未遂犯之處罰，以有特別規定者為限，並得按既遂犯之刑減輕之。", "id": 351}, {"law": "中華民國刑法", "chapter": "第 三 章 未遂犯", "num": "26", "title": "第 26 條", "content": "行為不能發生犯罪之結果，又無危險者，不罰。", "id": 352}, {"law": "中華民國刑法", "chapter": "第 三 章 未遂犯", "num": "27", "title": "第 27 條", "content": "1 已著手於犯罪行為之實行，而因己意中止或防止其結果之發生者，減輕或免除其刑。結果之不發生，非防止行為所致，而行為人已盡力為防止行為者，亦同。\n2 前項規定，於正犯或共犯中之一人或數人，因己意防止犯罪結果之發生，或結果之不發生，非防止行為所致，而行為人已盡力為防止行為者，亦適用之。", "id": 353}, {"law": "中華民國刑法", "chapter": "第 四 章 正犯與共犯", "num": "28", "title": "第 28 條", "content": "二人以上共同實行犯罪之行為者，皆為正犯。", "id": 354}, {"law": "中華民國刑法", "chapter": "第 四 章 正犯與共犯", "num": "29", "title": "第 29 條", "content": "1 教唆他人使之實行犯罪行為者，為教唆犯。\n2 教唆犯之處罰，依其所教唆之罪處罰之。", "id": 355}, {"law": "中華民國刑法", "chapter": "第 四 章 正犯與共犯", "num": "30", "title": "第 30 條", "content": "1 幫助他人實行犯罪行為者，為幫助犯。雖他人不知幫助之情者，亦同。\n2 幫助犯之處罰，得按正犯之刑減輕之。", "id": 356}, {"law": "中華民國刑法", "chapter": "第 四 章 正犯與共犯", "num": "31", "title": "第 31 條", "content": "1 因身分或其他特定關係成立之罪，其共同實行、教唆或幫助者，雖無特定關係，仍以正犯或共犯論。但得減輕其刑。\n2 因身分或其他特定關係致刑有重輕或免除者，其無特定關係之人，科以通常之刑。", "id": 357}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "32", "title": "第 32 條", "content": "刑分為主刑及從刑。", "id": 358}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "33", "title": "第 33 條", "content": "主刑之種類如下：\n一、死刑。\n二、無期徒刑。\n三、有期徒刑：二月以上十五年以下。但遇有加減時，得減至二月未滿，或加至二十年。\n四、拘役：一日以上，六十日未滿。但遇有加重時，得加至一百二十日。\n五、罰金：新臺幣一千元以上，以百元計算之。", "id": 359}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "34", "title": "第 34 條", "content": "（刪除）", "id": 360}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "35", "title": "第 35 條", "content": "1 主刑之重輕，依第三十三條規定之次序定之。\n2 同種之刑，以最高度之較長或較多者為重。最高度相等者，以最低度之較長或較多者為重。\n3 刑之重輕，以最重主刑為準，依前二項標準定之。最重主刑相同者，參酌下列各款標準定其輕重：\n一、有選科主刑者與無選科主刑者，以無選科主刑者為重。\n二、有併科主刑者與無併科主刑者，以有併科主刑者為重。\n三、次重主刑同為選科刑或併科刑者，以次重主刑為準，依前二項標準定之。", "id": 361}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "36", "title": "第 36 條", "content": "1 從刑為褫奪公權。\n2 褫奪公權者，褫奪下列資格：\n一、為公務員之資格。\n二、為公職候選人之資格。", "id": 362}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "37", "title": "第 37 條", "content": "1 宣告死刑或無期徒刑者，宣告褫奪公權終身。\n2 宣告一年以上有期徒刑，依犯罪之性質認為有褫奪公權之必要者，宣告一年以上十年以下褫奪公權。\n3 褫奪公權，於裁判時併宣告之。\n4 褫奪公權之宣告，自裁判確定時發生效力。\n5 依第二項宣告褫奪公權者，其期間自主刑執行完畢或赦免之日起算。但同時宣告緩刑者，其期間自裁判確定時起算之。", "id": 363}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "37-1", "title": "第 37-1 條", "content": "1 刑期自裁判確定之日起算。\n2 裁判雖經確定，其尚未受拘禁之日數，不算入刑期內。", "id": 364}, {"law": "中華民國刑法", "chapter": "第 五 章 刑", "num": "37-2", "title": "第 37-2 條", "content": "1 裁判確定前羈押之日數，以一日抵有期徒刑或拘役一日，或第四十二條第六項裁判所定之罰金額數。\n2 羈押之日數，無前項刑罰可抵，如經宣告拘束人身自由之保安處分者，得以一日抵保安處分一日。", "id": 365}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "38", "title": "第 38 條", "content": "1 違禁物，不問屬於犯罪行為人與否，沒收之。\n2 供犯罪所用、犯罪預備之物或犯罪所生之物，屬於犯罪行為人者，得沒收之。但有特別規定者，依其規定。\n3 前項之物屬於犯罪行為人以外之自然人、法人或非法人團體，而無正當理由提供或取得者，得沒收之。但有特別規定者，依其規定。\n4 前二項之沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。", "id": 366}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "38-1", "title": "第 38-1 條", "content": "1 犯罪所得，屬於犯罪行為人者，沒收之。但有特別規定者，依其規定。\n2 犯罪行為人以外之自然人、法人或非法人團體，因下列情形之一取得犯罪所得者，亦同：\n一、明知他人違法行為而取得。\n二、因他人違法行為而無償或以顯不相當之對價取得。\n三、犯罪行為人為他人實行違法行為，他人因而取得。\n3 前二項之沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。\n4 第一項及第二項之犯罪所得，包括違法行為所得、其變得之物或財產上利益及其孳息。\n5 犯罪所得已實際合法發還被害人者，不予宣告沒收或追徵。", "id": 367}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "38-2", "title": "第 38-2 條", "content": "1 前條犯罪所得及追徵之範圍與價額，認定顯有困難時，得以估算認定之。第三十八條之追徵，亦同。\n2 宣告前二條之沒收或追徵，有過苛之虞、欠缺刑法上之重要性、犯罪所得價值低微，或為維持受宣告人生活條件之必要者，得不宣告或酌減之。", "id": 368}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "38-3", "title": "第 38-3 條", "content": "1 第三十八條之物及第三十八條之一之犯罪所得之所有權或其他權利，於沒收裁判確定時移轉為國家所有。\n2 前項情形，第三人對沒收標的之權利或因犯罪而得行使之債權均不受影響。\n3 第一項之沒收裁判，於確定前，具有禁止處分之效力。", "id": 369}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "39", "title": "第 39 條", "content": "（刪除）", "id": 370}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "40", "title": "第 40 條", "content": "1 沒收，除有特別規定者外，於裁判時併宣告之。\n2 違禁物或專科沒收之物得單獨宣告沒收。\n3 第三十八條第二項、第三項之物、第三十八條之一第一項、第二項之犯罪所得，因事實上或法律上原因未能追訴犯罪行為人之犯罪或判決有罪者，得單獨宣告沒收。", "id": 371}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "40-1", "title": "第 40-1 條", "content": "（刪除）", "id": 372}, {"law": "中華民國刑法", "chapter": "第 五 章之一 沒收", "num": "40-2", "title": "第 40-2 條", "content": "1 宣告多數沒收者，併執行之。\n2 沒收，除違禁物及有特別規定者外，逾第八十條規定之時效期間，不得為之。\n3 沒收標的在中華民國領域外，而逾前項之時效完成後五年者，亦同。\n4 沒收之宣告，自裁判確定之日起，逾十年未開始或繼續執行者，不得執行。", "id": 373}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "41", "title": "第 41 條", "content": "1 犯最重本刑為五年以下有期徒刑以下之刑之罪，而受六月以下有期徒刑或拘役之宣告者，得以新臺幣一千元、二千元或三千元折算一日，易科罰金。但易科罰金，難收矯正之效或難以維持法秩序者，不在此限。\n2 依前項規定得易科罰金而未聲請易科罰金者，得以提供社會勞動六小時折算一日，易服社會勞動。\n3 受六月以下有期徒刑或拘役之宣告，不符第一項易科罰金之規定者，得依前項折算規定，易服社會勞動。\n4 前二項之規定，因身心健康之關係，執行顯有困難者，或易服社會勞動，難收矯正之效或難以維持法秩序者，不適用之。\n5 第二項及第三項之易服社會勞動履行期間，不得逾一年。\n6 無正當理由不履行社會勞動，情節重大，或履行期間屆滿仍未履行完畢者，於第二項之情形應執行原宣告刑或易科罰金；於第三項之情形應執行原宣告刑。\n7 已繳納之罰金或已履行之社會勞動時數依所定之標準折算日數，未滿一日者，以一日論。\n8 第一項至第四項及第七項之規定，於數罪併罰之數罪均得易科罰金或易服社會勞動，其應執行之刑逾六月者，亦適用之。\n9 數罪併罰應執行之刑易服社會勞動者，其履行期間不得逾三年。但其應執行之刑未逾六月者，履行期間不得逾一年。\n10 數罪併罰應執行之刑易服社會勞動有第六項之情形者，應執行所定之執行刑，於數罪均得易科罰金者，另得易科罰金。", "id": 374}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "42", "title": "第 42 條", "content": "1 罰金應於裁判確定後二個月內完納。期滿而不完納者，強制執行。其無力完納者，易服勞役。但依其經濟或信用狀況，不能於二個月內完納者，得許期滿後一年內分期繳納。遲延一期不繳或未繳足者，其餘未完納之罰金，強制執行或易服勞役。\n2 依前項規定應強制執行者，如已查明確無財產可供執行時，得逕予易服勞役。\n3 易服勞役以新臺幣一千元、二千元或三千元折算一日。但勞役期限不得逾一年。\n4 依第五十一條第七款所定之金額，其易服勞役之折算標準不同者，從勞役期限較長者定之。\n5 罰金總額折算逾一年之日數者，以罰金總額與一年之日數比例折算。依前項所定之期限，亦同。\n6 科罰金之裁判，應依前三項之規定，載明折算一日之額數。\n7 易服勞役不滿一日之零數，不算。\n8 易服勞役期內納罰金者，以所納之數，依裁判所定之標準折算，扣除勞役之日期。", "id": 375}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "42-1", "title": "第 42-1 條", "content": "1 罰金易服勞役，除有下列情形之一者外，得以提供社會勞動六小時折算一日，易服社會勞動：\n一、易服勞役期間逾一年。\n二、入監執行逾六月有期徒刑併科或併執行之罰金。\n三、因身心健康之關係，執行社會勞動顯有困難。\n2 前項社會勞動之履行期間不得逾二年。\n3 無正當理由不履行社會勞動，情節重大，或履行期間屆滿仍未履行完畢者，執行勞役。\n4 社會勞動已履行之時數折算勞役日數，未滿一日者，以一日論。\n5 社會勞動履行期間內繳納罰金者，以所納之數，依裁判所定罰金易服勞役之標準折算，扣除社會勞動之日數。\n6 依第三項執行勞役，於勞役期內納罰金者，以所納之數，依裁判所定罰金易服勞役之標準折算，扣除社會勞動與勞役之日數。", "id": 376}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "43", "title": "第 43 條", "content": "受拘役或罰金之宣告，而犯罪動機在公益或道義上顯可宥恕者，得易以訓誡。", "id": 377}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "44", "title": "第 44 條", "content": "易科罰金、易服社會勞動、易服勞役或易以訓誡執行完畢者，其所受宣告之刑，以已執行論。", "id": 378}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "45", "title": "第 45 條", "content": "（刪除）", "id": 379}, {"law": "中華民國刑法", "chapter": "第 五 章之二 易刑", "num": "46", "title": "第 46 條", "content": "（刪除）", "id": 380}, {"law": "中華民國刑法", "chapter": "第 六 章 累犯", "num": "47", "title": "第 47 條", "content": "1 受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯有期徒刑以上之罪者，為累犯，加重本刑至二分之一。\n2 第九十八條第二項關於因強制工作而免其刑之執行者，於受強制工作處分之執行完畢或一部之執行而免除後，五年以內故意再犯有期徒刑以上之罪者，以累犯論。", "id": 381}, {"law": "中華民國刑法", "chapter": "第 六 章 累犯", "num": "48", "title": "第 48 條", "content": "裁判確定後，發覺為累犯者，依前條之規定更定其刑。但刑之執行完畢或赦免後發覺者，不在此限。", "id": 382}, {"law": "中華民國刑法", "chapter": "第 六 章 累犯", "num": "49", "title": "第 49 條", "content": "累犯之規定，於前所犯罪在外國法院受裁判者，不適用之。", "id": 383}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "50", "title": "第 50 條", "content": "1 裁判確定前犯數罪者，併合處罰之。但有下列情形之一者，不在此限：\n一、得易科罰金之罪與不得易科罰金之罪。\n二、得易科罰金之罪與不得易服社會勞動之罪。\n三、得易服社會勞動之罪與不得易科罰金之罪。\n四、得易服社會勞動之罪與不得易服社會勞動之罪。\n2 前項但書情形，受刑人請求檢察官聲請定應執行刑者，依第五十一條規定定之。", "id": 384}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "51", "title": "第 51 條", "content": "數罪併罰，分別宣告其罪之刑，依下列各款定其應執行者：\n一、宣告多數死刑者，執行其一。\n二、宣告之最重刑為死刑者，不執行他刑。但罰金及從刑不在此限。\n三、宣告多數無期徒刑者，執行其一。\n四、宣告之最重刑為無期徒刑者，不執行他刑。但罰金及從刑不在此限。\n五、宣告多數有期徒刑者，於各刑中之最長期以上，各刑合併之刑期以下，定其刑期。但不得逾三十年。\n六、宣告多數拘役者，比照前款定其刑期。但不得逾一百二十日。\n七、宣告多數罰金者，於各刑中之最多額以上，各刑合併之金額以下，定其金額。\n八、宣告多數褫奪公權者，僅就其中最長期間執行之。\n九、依第五款至前款所定之刑，併執行之。但應執行者為三年以上有期徒刑與拘役時，不執行拘役。", "id": 385}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "52", "title": "第 52 條", "content": "數罪併罰，於裁判確定後，發覺未經裁判之餘罪者，就餘罪處斷。", "id": 386}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "53", "title": "第 53 條", "content": "數罪併罰，有二裁判以上者，依第五十一條之規定，定其應執行之刑。", "id": 387}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "54", "title": "第 54 條", "content": "數罪併罰，已經處斷，如各罪中有受赦免者，餘罪仍依第五十一條之規定，定其應執行之刑，僅餘一罪者，依其宣告之刑執行。", "id": 388}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "55", "title": "第 55 條", "content": "一行為而觸犯數罪名者，從一重處斷。但不得科以較輕罪名所定最輕本刑以下之刑。", "id": 389}, {"law": "中華民國刑法", "chapter": "第 七 章 數罪併罰", "num": "56", "title": "第 56 條", "content": "（刪除）", "id": 390}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "57", "title": "第 57 條", "content": "科刑時應以行為人之責任為基礎，並審酌一切情狀，尤應注意下列事項，為科刑輕重之標準：\n一、犯罪之動機、目的。\n二、犯罪時所受之刺激。\n三、犯罪之手段。\n四、犯罪行為人之生活狀況。\n五、犯罪行為人之品行。\n六、犯罪行為人之智識程度。\n七、犯罪行為人與被害人之關係。\n八、犯罪行為人違反義務之程度。\n九、犯罪所生之危險或損害。\n十、犯罪後之態度。", "id": 391}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "58", "title": "第 58 條", "content": "科罰金時，除依前條規定外，並應審酌犯罪行為人之資力及犯罪所得之利益。如所得之利益超過罰金最多額時，得於所得利益之範圍內酌量加重。", "id": 392}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "59", "title": "第 59 條", "content": "犯罪之情狀顯可憫恕，認科以最低度刑仍嫌過重者，得酌量減輕其刑。", "id": 393}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "60", "title": "第 60 條", "content": "依法律加重或減輕者，仍得依前條之規定酌量減輕其刑。", "id": 394}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "61", "title": "第 61 條", "content": "犯下列各罪之一，情節輕微，顯可憫恕，認為依第五十九條規定減輕其刑仍嫌過重者，得免除其刑：\n一、最重本刑為三年以下有期徒刑、拘役或專科罰金之罪。但第一百三十二條第一項、第一百四十三條、第一百四十五條、第一百八十六條及對於直系血親尊親屬犯第二百七十一條第三項之罪，不在此限。\n二、第三百二十條、第三百二十一條之竊盜罪。\n三、第三百三十五條、第三百三十六條第二項之侵占罪。\n四、第三百三十九條、第三百四十一條之詐欺罪。\n五、第三百四十二條之背信罪。\n六、第三百四十六條之恐嚇罪。\n七、第三百四十九條第二項之贓物罪。", "id": 395}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "62", "title": "第 62 條", "content": "對於未發覺之罪自首而受裁判者，得減輕其刑。但有特別規定者，依其規定。", "id": 396}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "63", "title": "第 63 條", "content": "未滿十八歲人或滿八十歲人犯罪者，不得處死刑或無期徒刑，本刑為死刑或無期徒刑者，減輕其刑。", "id": 397}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "64", "title": "第 64 條", "content": "1 死刑不得加重。\n2 死刑減輕者，為無期徒刑。", "id": 398}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "65", "title": "第 65 條", "content": "1 無期徒刑不得加重。\n2 無期徒刑減輕者，為二十年以下十五年以上有期徒刑。", "id": 399}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "66", "title": "第 66 條", "content": "有期徒刑、拘役、罰金減輕者，減輕其刑至二分之一。但同時有免除其刑之規定者，其減輕得減至三分之二。", "id": 400}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "67", "title": "第 67 條", "content": "有期徒刑或罰金加減者，其最高度及最低度同加減之。", "id": 401}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "68", "title": "第 68 條", "content": "拘役加減者，僅加減其最高度。", "id": 402}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "69", "title": "第 69 條", "content": "有二種以上之主刑者，加減時併加減之。", "id": 403}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "70", "title": "第 70 條", "content": "有二種以上刑之加重或減輕者，遞加或遞減之。", "id": 404}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "71", "title": "第 71 條", "content": "1 刑有加重及減輕者，先加後減。\n2 有二種以上之減輕者，先依較少之數減輕之。", "id": 405}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "72", "title": "第 72 條", "content": "因刑之加重、減輕，而有不滿一日之時間或不滿一元之額數者，不算。", "id": 406}, {"law": "中華民國刑法", "chapter": "第 八 章 刑之酌科及加減", "num": "73", "title": "第 73 條", "content": "酌量減輕其刑者，準用減輕其刑之規定。", "id": 407}, {"law": "中華民國刑法", "chapter": "第 九 章 緩刑", "num": "74", "title": "第 74 條", "content": "1 受二年以下有期徒刑、拘役或罰金之宣告，而有下列情形之一，認以暫不執行為適當者，得宣告二年以上五年以下之緩刑，其期間自裁判確定之日起算：\n一、未曾因故意犯罪受有期徒刑以上刑之宣告者。\n二、前因故意犯罪受有期徒刑以上刑之宣告，執行完畢或赦免後，五年以內未曾因故意犯罪受有期徒刑以上刑之宣告者。\n2 緩刑宣告，得斟酌情形，命犯罪行為人為下列各款事項：\n一、向被害人道歉。\n二、立悔過書。\n三、向被害人支付相當數額之財產或非財產上之損害賠償。\n四、向公庫支付一定之金額。\n五、向指定之政府機關、政府機構、行政法人、社區或其他符合公益目的之機構或團體，提供四十小時以上二百四十小時以下之義務勞務。\n六、完成戒癮治療、精神治療、心理輔導或其他適當之處遇措施。\n七、保護被害人安全之必要命令。\n八、預防再犯所為之必要命令。\n3 前項情形，應附記於判決書內。\n4 第二項第三款、第四款得為民事強制執行名義。\n5 緩刑之效力不及於從刑、保安處分及沒收之宣告。", "id": 408}, {"law": "中華民國刑法", "chapter": "第 九 章 緩刑", "num": "75", "title": "第 75 條", "content": "1 受緩刑之宣告，而有下列情形之一者，撤銷其宣告：\n一、緩刑期內因故意犯他罪，而在緩刑期內受逾六月有期徒刑之宣告確定者。\n二、緩刑前因故意犯他罪，而在緩刑期內受逾六月有期徒刑之宣告確定者。\n2 前項撤銷之聲請，於判決確定後六月以內為之。", "id": 409}, {"law": "中華民國刑法", "chapter": "第 九 章 緩刑", "num": "75-1", "title": "第 75-1 條", "content": "1 受緩刑之宣告而有下列情形之一，足認原宣告之緩刑難收其預期效果，而有執行刑罰之必要者，得撤銷其宣告：\n一、緩刑前因故意犯他罪，而在緩刑期內受六月以下有期徒刑、拘役或罰金之宣告確定者。\n二、緩刑期內因故意犯他罪，而在緩刑期內受六月以下有期徒刑、拘役或罰金之宣告確定者。\n三、緩刑期內因過失更犯罪，而在緩刑期內受有期徒刑之宣告確定者。\n四、違反第七十四條第二項第一款至第八款所定負擔情節重大者。\n2 前條第二項之規定，於前項第一款至第三款情形亦適用之。", "id": 410}, {"law": "中華民國刑法", "chapter": "第 九 章 緩刑", "num": "76", "title": "第 76 條", "content": "緩刑期滿，而緩刑之宣告未經撤銷者，其刑之宣告失其效力。但依第七十五條第二項、第七十五條之一第二項撤銷緩刑宣告者，不在此限。", "id": 411}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "77", "title": "第 77 條", "content": "1 受徒刑之執行而有悛悔實據者，無期徒刑逾二十五年，有期徒刑逾二分之一、累犯逾三分之二，由監獄報請法務部，得許假釋出獄。\n2 前項關於有期徒刑假釋之規定，於下列情形，不適用之：\n一、有期徒刑執行未滿六個月者。\n二、犯最輕本刑五年以上有期徒刑之罪之累犯，於假釋期間，受徒刑之執行完畢，或一部之執行而赦免後，五年以內故意再犯最輕本刑為五年以上有期徒刑之罪者。\n三、犯第九十一條之一所列之罪，於徒刑執行期間接受輔導或治療後，經鑑定、評估其再犯危險未顯著降低者。\n3 無期徒刑裁判確定前逾一年部分之羈押日數算入第一項已執行之期間內。", "id": 412}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "78", "title": "第 78 條", "content": "1 假釋中因故意更犯罪，受逾六月有期徒刑之宣告確定者，撤銷其假釋。\n2 假釋中因故意更犯罪，受緩刑或六月以下有期徒刑之宣告確定，而有再入監執行刑罰之必要者，得撤銷其假釋。\n3 前二項之撤銷，於判決確定後六月以內為之。但假釋期滿逾三年者，不在此限。\n4 假釋撤銷後，其出獄日數不算入刑期內。", "id": 413}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "78-1", "title": "第 78-1 條", "content": "1 無期徒刑受刑人經撤銷假釋者，應執行原無期徒刑。如假釋期間有更犯之罪，併執行之。\n2 前項應執行之原無期徒刑，除假釋期間更犯之罪經宣告無期徒刑確定者外，其有悛悔實據者，於執行滿下列期間後，由監獄報請法務部，得再許假釋出獄：\n一、依其他法律規定撤銷假釋，或因假釋期間故意更犯罪而受未滿一年有期徒刑之宣告確定者，十年。\n二、假釋期間故意更犯罪，受一年以上未滿五年有期徒刑之宣告確定者，十五年。\n三、假釋期間故意更犯罪，受五年以上有期徒刑之宣告確定者，二十五年。\n3 無期徒刑受刑人有前項數款之情形者，得再許假釋之期間，以最長之期間計算之。\n4 適用前二項得再次報請假釋之期間，短於其因更犯罪應執行刑之期間者，以應執行刑之期間為無期徒刑殘餘刑期得再許假釋之期間。", "id": 414}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "78-2", "title": "第 78-2 條", "content": "1 有期徒刑經撤銷假釋，殘餘刑期十年以下者，於全部執行完畢後，再接續執行他刑，不適用第七十九條之一第一項有關合併計算執行期間之規定。\n2 有期徒刑經撤銷假釋，殘餘刑期逾十年者，於執行滿十年後，所餘刑期之執行，適用第七十七條第一項規定。\n3 前項情形，如有更犯之罪並受刑之宣告確定者，所餘刑期之執行，適用第七十七條第一項規定計算後，併同更犯之罪應執行之刑，適用第七十九條之一第一項有關合併計算最低應執行期間之規定。", "id": 415}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "79", "title": "第 79 條", "content": "1 在無期徒刑假釋後滿二十年或在有期徒刑所餘刑期內未經撤銷假釋者，其未執行之刑，以已執行論。但依第七十八條第三項撤銷其假釋者，不在此限。\n2 假釋中另受刑之執行、羈押或其他依法拘束人身自由之期間，不算入假釋期內。但不起訴處分或無罪判決確定前曾受之羈押或其他依法拘束人身自由之期間，不在此限。", "id": 416}, {"law": "中華民國刑法", "chapter": "第 十 章 假釋", "num": "79-1", "title": "第 79-1 條", "content": "1 二以上徒刑併執行者，第七十七條及第七十八條之一所定最低應執行之期間，合併計算之。\n2 前項情形，併執行無期徒刑者，適用無期徒刑假釋之規定；二以上有期徒刑合併刑期逾四十年，而接續執行逾二十年者，亦得許假釋。但有第七十七條第二項第二款、第七十八條之一、第七十八條之二之情形者，不在此限。\n3 依第一項規定合併計算執行期間而假釋者，前條第一項規定之期間，亦合併計算之。\n4 前項合併計算後之期間逾二十年者，準用前條第一項無期徒刑假釋之規定。", "id": 417}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "80", "title": "第 80 條", "content": "1 追訴權，因下列期間內未起訴而消滅：\n一、犯最重本刑為死刑、無期徒刑或十年以上有期徒刑之罪者，三十年。但發生死亡結果者，不在此限。\n二、犯最重本刑為三年以上十年未滿有期徒刑之罪者，二十年。\n三、犯最重本刑為一年以上三年未滿有期徒刑之罪者，十年。\n四、犯最重本刑為一年未滿有期徒刑、拘役或罰金之罪者，五年。\n2 前項期間自犯罪成立之日起算。但犯罪行為有繼續之狀態者，自行為終了之日起算。\n3 犯第二百二十一條至第二百二十七條、第二百二十八條、第二百二十九條、第三百三十二條第二項第二款、第三百三十四條第二項第二款或第三百四十八條第二項第一款之罪者，於被害人滿二十歲前，不計入第一項期間。", "id": 418}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "81", "title": "第 81 條", "content": "（刪除）", "id": 419}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "82", "title": "第 82 條", "content": "本刑應加重或減輕者，追訴權之時效期間，仍依本刑計算。", "id": 420}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "83", "title": "第 83 條", "content": "1 追訴權之時效，因起訴而停止進行。依法應停止偵查或因犯罪行為人逃匿而通緝者，亦同。\n2 前項時效之停止進行，有下列情形之一者，其停止原因視為消滅：\n一、諭知公訴不受理判決確定，或因程序上理由終結自訴確定者。\n二、審判程序依法律之規定或因被告逃匿而通緝，不能開始或繼續，而其期間已達第八十條第一項各款所定期間三分之一者。\n三、依第一項後段規定停止偵查或通緝，而其期間已達第八十條第一項各款所定期間三分之一者。\n3 前二項之時效，自停止原因消滅之日起，與停止前已經過之期間，一併計算。", "id": 421}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "84", "title": "第 84 條", "content": "1 行刑權因下列期間內未執行而消滅：\n一、宣告死刑、無期徒刑或十年以上有期徒刑者，四十年。\n二、宣告三年以上十年未滿有期徒刑者，三十年。\n三、宣告一年以上三年未滿有期徒刑者，十五年。\n四、宣告一年未滿有期徒刑、拘役或罰金者，七年。\n2 前項期間，自裁判確定之日起算。但因保安處分先於刑罰執行者，自保安處分執行完畢之日起算。", "id": 422}, {"law": "中華民國刑法", "chapter": "第 十一 章 時效", "num": "85", "title": "第 85 條", "content": "1 行刑權之時效，因刑之執行而停止進行。有下列情形之一而不能開始或繼續執行時，亦同：\n一、依法應停止執行者。\n二、因受刑人逃匿而通緝或執行期間脫逃未能繼續執行者。\n三、受刑人依法另受拘束自由者。\n2 停止原因繼續存在之期間，如達於第八十四條第一項各款所定期間三分之一者，其停止原因視為消滅。\n3 第一項之時效，自停止原因消滅之日起，與停止前已經過之期間，一併計算。", "id": 423}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "86", "title": "第 86 條", "content": "1 因未滿十四歲而不罰者，得令入感化教育處所，施以感化教育。\n2 因未滿十八歲而減輕其刑者，得於刑之執行完畢或赦免後，令入感化教育處所，施以感化教育。\n但宣告三年以下有期徒刑、拘役或罰金者，得於執行前為之。\n3 感化教育之期間為三年以下。但執行已逾六月，認無繼續執行之必要者，法院得免其處分之執行。", "id": 424}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "87", "title": "第 87 條", "content": "1 因第十九條第一項之原因而不罰者，其情狀足認有再犯或有危害公共安全之虞時，令入相當處所或以適當方式，施以監護。\n2 有第十九條第二項及第二十條之原因，其情狀足認有再犯或有危害公共安全之虞時，於刑之執行完畢或赦免後，令入相當處所或以適當方式，施以監護。但必要時，得於刑之執行前為之。\n3 前二項之期間為五年以下；其執行期間屆滿前，檢察官認為有延長之必要者，得聲請法院許可延長之，第一次延長期間為三年以下，第二次以後每次延長期間為一年以下。但執行中認無繼續執行之必要者，法院得免其處分之執行。\n4 前項執行或延長期間內，應每年評估有無繼續執行之必要。", "id": 425}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "88", "title": "第 88 條", "content": "1 施用毒品成癮者，於刑之執行前令入相當處所，施以禁戒。\n2 前項禁戒期間為一年以下。但執行中認無繼續執行之必要者，法院得免其處分之執行。", "id": 426}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "89", "title": "第 89 條", "content": "1 因酗酒而犯罪，足認其已酗酒成癮並有再犯之虞者，於刑之執行前，令入相當處所，施以禁戒。\n2 前項禁戒期間為一年以下。但執行中認無繼續執行之必要者，法院得免其處分之執行。", "id": 427}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "90", "title": "第 90 條", "content": "1 有犯罪之習慣或因遊蕩或懶惰成習而犯罪者，於刑之執行前，令入勞動場所，強制工作。\n2 前項之處分期間為三年。但執行滿一年六月後，認無繼續執行之必要者，法院得免其處分之執行。\n3 執行期間屆滿前，認為有延長之必要者，法院得許可延長之，其延長之期間不得逾一年六月，並以一次為限。", "id": 428}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "91", "title": "第 91 條", "content": "（刪除）", "id": 429}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "91-1", "title": "第 91-1 條", "content": "1 犯第二百二十一條至第二百二十七條、第二百二十八條、第二百二十九條、第二百三十條、第二百三十四條、第三百三十二條第二項第二款、第三百三十四條第二項第二款、第三百四十八條第二項第一款及其特別法之罪，而有下列情形之一者，得令入相當處所，施以強制治療：\n一、徒刑執行期滿前，於接受輔導或治療後，經鑑定、評估，認有再犯之危險者。\n二、依其他法律規定，於接受身心治療、輔導或教育後，經鑑定、評估，認有再犯之危險者。\n2 前項處分期間為五年以下；其執行期間屆滿前，檢察官認為有延長之必要者，得聲請法院許可延長之，第一次延長期間為三年以下，第二次以後每次延長期間為一年以下。但執行中認無繼續執行之必要者，法院得停止治療之執行。\n3 停止治療之執行後有第一項情形之一者，法院得令入相當處所，繼續施以強制治療。\n4 前項強制治療之期間，應與停止治療前已執行之期間合併計算。\n5 前三項執行或延長期間內，應每年鑑定、評估有無繼續治療之必要。", "id": 430}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "92", "title": "第 92 條", "content": "1 第八十六條至第九十條之處分，按其情形得以保護管束代之。\n2 前項保護管束期間為三年以下。其不能收效者，得隨時撤銷之，仍執行原處分。", "id": 431}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "93", "title": "第 93 條", "content": "1 受緩刑之宣告者，除有下列情形之一，應於緩刑期間付保護管束外，得於緩刑期間付保護管束：\n一、犯第九十一條之一所列之罪者。\n二、執行第七十四條第二項第五款至第八款所定之事項者。\n2 假釋出獄者，在假釋中付保護管束。", "id": 432}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "94", "title": "第 94 條", "content": "（刪除）", "id": 433}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "95", "title": "第 95 條", "content": "外國人受有期徒刑以上刑之宣告者，得於刑之執行完畢或赦免後，驅逐出境。", "id": 434}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "96", "title": "第 96 條", "content": "保安處分於裁判時併宣告之。但本法或其他法律另有規定者，不在此限。", "id": 435}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "97", "title": "第 97 條", "content": "（刪除）", "id": 436}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "98", "title": "第 98 條", "content": "1 依第八十六條第二項、第八十七條第二項、第三項規定宣告之保安處分，其先執行徒刑者，於刑之執行完畢或赦免後，認為無執行之必要者，法院得免其處分之執行；其先執行保安處分者，於處分執行完畢或一部執行而免除後，認為無執行刑之必要者，法院得免其刑之全部或一部執行。\n2 依第八十八條第一項、第八十九條第一項規定宣告之保安處分，於處分執行完畢或一部執行而免除後，認為無執行刑之必要者，法院得免其刑之全部或一部執行。\n3 依刑事訴訟法第一百二十一條之一第一項或第三項前段宣告之暫行安置執行後，認為無執行刑之必要者，法院得免其刑之全部或一部執行。\n4 前三項免其刑之執行，以有期徒刑或拘役為限。", "id": 437}, {"law": "中華民國刑法", "chapter": "第 十二 章 保安處分", "num": "99", "title": "第 99 條", "content": "保安處分自應執行之日起逾三年未開始或繼續執行者，非經法院認為原宣告保安處分之原因仍繼續存在時，不得許可執行；逾七年未開始或繼續執行者，不得執行。", "id": 438}, {"law": "中華民國刑法", "chapter": "第 一 章 內亂罪", "num": "100", "title": "第 100 條", "content": "1 意圖破壞國體，竊據國土，或以非法之方法變更國憲，顛覆政府，而以強暴或脅迫著手實行者，處七年以上有期徒刑；首謀者，處無期徒刑。\n2 預備犯前項之罪者，處六月以上五年以下有期徒刑。", "id": 439}, {"law": "中華民國刑法", "chapter": "第 一 章 內亂罪", "num": "101", "title": "第 101 條", "content": "1 以暴動犯前條第一項之罪者，處無期徒刑或七年以上有期徒刑。首謀者，處死刑或無期徒刑。\n2 預備或陰謀犯前項之罪者，處一年以上七年以下有期徒刑。", "id": 440}, {"law": "中華民國刑法", "chapter": "第 一 章 內亂罪", "num": "102", "title": "第 102 條", "content": "犯第一百條第二項或第一百零一條第二項之罪而自首者，減輕或免除其刑。", "id": 441}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "103", "title": "第 103 條", "content": "1 通謀外國或其派遣之人，意圖使該國或他國對於中華民國開戰端者，處死刑或無期徒刑。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處三年以上十年以下有期徒刑。", "id": 442}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "104", "title": "第 104 條", "content": "1 通謀外國或其派遣之人，意圖使中華民國領域屬於該國或他國者，處死刑或無期徒刑。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處三年以上十年以下有期徒刑。", "id": 443}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "105", "title": "第 105 條", "content": "1 中華民國人民在敵軍執役，或與敵國械抗中華民國或其同盟國者，處死刑或無期徒刑。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處三年以上十年以下有期徒刑。", "id": 444}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "106", "title": "第 106 條", "content": "1 在與外國開戰或將開戰期內，以軍事上之利益供敵國，或以軍事上之不利益害中華民國或其同盟國者，處無期徒刑或七年以上有期徒刑。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處五年以下有期徒刑。", "id": 445}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "107", "title": "第 107 條", "content": "1 犯前條第一項之罪而有左列情形之一者，處死刑或無期徒刑：\n一、將軍隊交付敵國，或將要塞、軍港、軍營、軍用船艦、航空機及其他軍用處所建築物，與供中華民國軍用之軍械、彈藥、錢糧及其他軍需品，或橋樑、鐵路、車輛、電線、電機、電局及其他供轉運之器物，交付敵國或毀壞或致令不堪用者。\n二、代敵國招募軍隊，或煽惑軍人使其降敵者。\n三、煽惑軍人不執行職務，或不守紀律或逃叛者。\n四、以關於要塞、軍港、軍營、軍用船艦、航空機及其他軍用處所建築物或軍略之秘密文書、圖畫、消息或物品，洩漏或交付於敵國者。\n五、為敵國之間諜，或幫助敵國之間諜者。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處三年以上十年以下有期徒刑。", "id": 446}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "108", "title": "第 108 條", "content": "1 在與外國開戰或將開戰期內，不履行供給軍需之契約或不照契約履行者，處一年以上七年以下有期徒刑，得併科十五萬元以下罰金。\n2 因過失犯前項之罪者，處二年以下有期徒刑、拘役或三萬元以下罰金。", "id": 447}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "109", "title": "第 109 條", "content": "1 洩漏或交付關於中華民國國防應秘密之文書、圖畫、消息或物品者，處一年以上七年以下有期徒刑。\n2 洩漏或交付前項之文書、圖畫、消息或物品於外國或其派遣之人者，處三年以上十年以下有期徒刑。\n3 前二項之未遂犯罰之。\n4 預備或陰謀犯第一項或第二項之罪者，處二年以下有期徒刑。", "id": 448}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "110", "title": "第 110 條", "content": "公務員對於職務上知悉或持有前條第一項之文書、圖畫、消息或物品，因過失而洩漏或交付者，處二年以下有期徒刑、拘役或三萬元以下罰金。", "id": 449}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "111", "title": "第 111 條", "content": "1 刺探或收集第一百零九條第一項之文書、圖畫、消息或物品者，處五年以下有期徒刑。\n2 前項之未遂犯罰之。\n3 預備或陰謀犯第一項之罪者，處一年以下有期徒刑。", "id": 450}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "112", "title": "第 112 條", "content": "意圖刺探或收集第一百零九條第一項之文書、圖畫、消息或物品，未受允准而入要塞、軍港、軍艦及其他軍用處所建築物，或留滯其內者，處一年以下有期徒刑。", "id": 451}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "113", "title": "第 113 條", "content": "應經政府授權之事項，未獲授權，私與外國政府或其派遣之人為約定，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金；足以生損害於中華民國者，處無期徒刑或七年以上有期徒刑。", "id": 452}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "114", "title": "第 114 條", "content": "受政府之委任，處理對於外國政府之事務，而違背其委任，致生損害於中華民國者，處無期徒刑或七年以上有期徒刑。", "id": 453}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "115", "title": "第 115 條", "content": "偽造、變造、毀棄或隱匿可以證明中華民國對於外國所享權利之文書、圖畫或其他證據者，處五年以上十二年以下有期徒刑。", "id": 454}, {"law": "中華民國刑法", "chapter": "第 二 章 外患罪", "num": "115-1", "title": "第 115-1 條", "content": "本章之罪，亦適用於地域或對象為大陸地區、香港、澳門、境外敵對勢力或其派遣之人，行為人違反各條規定者，依各該條規定處斷之。", "id": 455}, {"law": "中華民國刑法", "chapter": "第 三 章 妨害國交罪", "num": "116", "title": "第 116 條", "content": "對於友邦元首或派至中華民國之外國代表，犯故意傷害罪、妨害自由罪或妨害名譽罪者，得加重其刑至三分之一。", "id": 456}, {"law": "中華民國刑法", "chapter": "第 三 章 妨害國交罪", "num": "117", "title": "第 117 條", "content": "於外國交戰之際，違背政府局外中立之命令者，處一年以下有期徒刑、拘役或九萬元以下罰金。", "id": 457}, {"law": "中華民國刑法", "chapter": "第 三 章 妨害國交罪", "num": "118", "title": "第 118 條", "content": "意圖侮辱外國，而公然損壞、除去或污辱外國之國旗、國章者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 458}, {"law": "中華民國刑法", "chapter": "第 三 章 妨害國交罪", "num": "119", "title": "第 119 條", "content": "第一百一十六條之妨害名譽罪及第一百一十八條之罪，須外國政府之請求乃論。", "id": 459}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "120", "title": "第 120 條", "content": "公務員不盡其應盡之責，而委棄守地者，處死刑、無期徒刑或十年以上有期徒刑。", "id": 460}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "121", "title": "第 121 條", "content": "公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，得併科七十萬元以下罰金。", "id": 461}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "122", "title": "第 122 條", "content": "1 公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金。\n2 因而為違背職務之行為者，處無期徒刑或五年以上有期徒刑，得併科四百萬元以下罰金。\n3 對於公務員或仲裁人關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑，得併科三十萬元以下罰金。但自首者減輕或免除其刑。在偵查或審判中自白者，得減輕其刑。", "id": 462}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "123", "title": "第 123 條", "content": "於未為公務員或仲裁人時，預以職務上之行為，要求期約或收受賄賂或其他不正利益，而於為公務員或仲裁人後履行者，以公務員或仲裁人要求期約或收受賄賂或其他不正利益論。", "id": 463}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "124", "title": "第 124 條", "content": "有審判職務之公務員或仲裁人，為枉法之裁判或仲裁者，處一年以上七年以下有期徒刑。", "id": 464}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "125", "title": "第 125 條", "content": "1 有追訴或處罰犯罪職務之公務員，為左列行為之一者，處一年以上七年以下有期徒刑：\n一、濫用職權為逮捕或羈押者。\n二、意圖取供而施強暴脅迫者。\n三、明知為無罪之人，而使其受追訴或處罰，或明知為有罪之人，而無故不使其受追訴或處罰者。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑。致重傷者，處三年以上十年以下有期徒刑。", "id": 465}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "126", "title": "第 126 條", "content": "1 有管收、解送或拘禁人犯職務之公務員，對於人犯施以凌虐者，處一年以上七年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑。致重傷者，處三年以上十年以下有期徒刑。", "id": 466}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "127", "title": "第 127 條", "content": "1 有執行刑罰職務之公務員，違法執行或不執行刑罰者，處五年以下有期徒刑。\n2 因過失而執行不應執行之刑罰者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 467}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "128", "title": "第 128 條", "content": "公務員對於訴訟事件，明知不應受理而受理者，處三年以下有期徒刑。", "id": 468}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "129", "title": "第 129 條", "content": "1 公務員對於租稅或其他入款，明知不應徵收而徵收者，處一年以上七年以下有期徒刑，得併科二十一萬元以下罰金。\n2 公務員對於職務上發給之款項、物品，明知應發給而抑留不發或剋扣者，亦同。\n3 前二項之未遂犯罰之。", "id": 469}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "130", "title": "第 130 條", "content": "公務員廢弛職務釀成災害者，處三年以上十年以下有期徒刑。", "id": 470}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "131", "title": "第 131 條", "content": "公務員對於主管或監督之事務，明知違背法令，直接或間接圖自己或其他私人不法利益，因而獲得利益者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金。", "id": 471}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "132", "title": "第 132 條", "content": "1 公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑。\n2 因過失犯前項之罪者，處一年以下有期徒刑、拘役或九千元以下罰金。\n3 非公務員因職務或業務知悉或持有第一項之文書、圖畫、消息或物品，而洩漏或交付之者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 472}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "133", "title": "第 133 條", "content": "在郵務或電報機關執行職務之公務員，開拆或隱匿投寄之郵件或電報者，處三年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 473}, {"law": "中華民國刑法", "chapter": "第 四 章 瀆職罪", "num": "134", "title": "第 134 條", "content": "公務員假借職務上之權力、機會或方法，以故意犯本章以外各罪者，加重其刑至二分之一。但因公務員之身分已特別規定其刑者，不在此限。", "id": 474}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "135", "title": "第 135 條", "content": "1 對於公務員依法執行職務時，施強暴脅迫者，處三年以下有期徒刑、拘役或三十萬元以下罰金。\n2 意圖使公務員執行一定之職務或妨害其依法執行一定之職務或使公務員辭職，而施強暴脅迫者，亦同。\n3 犯前二項之罪而有下列情形之一者，處六月以上五年以下有期徒刑：\n一、以駕駛動力交通工具犯之。\n二、意圖供行使之用而攜帶兇器或其他危險物品犯之。\n4 犯前三項之罪，因而致公務員於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "id": 475}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "136", "title": "第 136 條", "content": "1 在公共場所或公眾得出入之場所，聚集三人以上犯前條之罪者，在場助勢之人，處一年以下有期徒刑、拘役或十萬元以下罰金；首謀及下手實施強暴、脅迫者，處一年以上七年以下有期徒刑。\n2 因而致公務員於死或重傷者，首謀及下手實施強暴脅迫之人，依前條第四項之規定處斷。", "id": 476}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "137", "title": "第 137 條", "content": "1 對於依考試法舉行之考試，以詐術或其他非法之方法，使其發生不正確之結果者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 前項之未遂犯罰之。", "id": 477}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "138", "title": "第 138 條", "content": "毀棄、損壞或隱匿公務員職務上掌管或委託第三人掌管之文書、圖畫、物品，或致令不堪用者，處五年以下有期徒刑。", "id": 478}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "139", "title": "第 139 條", "content": "1 損壞、除去或污穢公務員依法所施之封印或查封之標示，或為違背其效力之行為者，處二年以下有期徒刑、拘役或二十萬元以下罰金。\n2 為違背公務員依法所發具扣押效力命令之行為者，亦同。", "id": 479}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "140", "title": "第 140 條", "content": "於公務員依法執行職務時，當場侮辱或對於其依法執行之職務公然侮辱者，處一年以下有期徒刑、拘役或十萬元以下罰金。", "id": 480}, {"law": "中華民國刑法", "chapter": "第 五 章 妨害公務罪", "num": "141", "title": "第 141 條", "content": "意圖侮辱公務員，而損壞、除去或污穢實貼公共場所之文告者，處拘役或六萬元以下罰金。", "id": 481}, {"law": "中華民國刑法", "chapter": "第 五 章之一 藐視國會罪", "num": "141-1", "title": "第 141-1 條", "content": "公務員於立法院聽證或受質詢時，就其所知之重要關係事項，為虛偽陳述者，處一年以下有期徒刑、拘役或二十萬元以下罰金。", "id": 482}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "142", "title": "第 142 條", "content": "1 以強暴脅迫或其他非法之方法，妨害他人自由行使法定之政治上選舉或其他投票權者，處五年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 483}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "143", "title": "第 143 條", "content": "有投票權之人，要求、期約或收受賄賂或其他不正利益，而許以不行使其投票權或為一定之行使者，處三年以下有期徒刑，得併科三十萬元以下罰金。", "id": 484}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "144", "title": "第 144 條", "content": "對於有投票權之人，行求、期約或交付賄賂或其他不正利益，而約其不行使投票權或為一定之行使者，處五年以下有期徒刑，得併科二十一萬元以下罰金。", "id": 485}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "145", "title": "第 145 條", "content": "以生計上之利害，誘惑投票人不行使其投票權或為一定之行使者，處三年以下有期徒刑。", "id": 486}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "146", "title": "第 146 條", "content": "1 以詐術或其他非法之方法，使投票發生不正確之結果或變造投票之結果者，處五年以下有期徒刑。\n2 意圖使特定候選人當選，以虛偽遷徙戶籍取得投票權而為投票者，亦同。\n3 前二項之未遂犯罰之。", "id": 487}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "147", "title": "第 147 條", "content": "妨害或擾亂投票者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 488}, {"law": "中華民國刑法", "chapter": "第 六 章 妨害投票罪", "num": "148", "title": "第 148 條", "content": "於無記名之投票，刺探票載之內容者，處九千元以下罰金。", "id": 489}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "149", "title": "第 149 條", "content": "在公共場所或公眾得出入之場所聚集三人以上，意圖為強暴脅迫，已受該管公務員解散命令三次以上而不解散者，在場助勢之人處六月以下有期徒刑、拘役或八萬元以下罰金；首謀者，處三年以下有期徒刑。", "id": 490}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "150", "title": "第 150 條", "content": "1 在公共場所或公眾得出入之場所聚集三人以上，施強暴脅迫者，在場助勢之人，處一年以下有期徒刑、拘役或十萬元以下罰金；首謀及下手實施者，處六月以上五年以下有期徒刑。\n2 犯前項之罪，而有下列情形之一者，得加重其刑至二分之一：\n一、意圖供行使之用而攜帶兇器或其他危險物品犯之。\n二、因而致生公眾或交通往來之危險。", "id": 491}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "151", "title": "第 151 條", "content": "以加害生命、身體、財產之事恐嚇公眾，致生危害於公安者，處二年以下有期徒刑。", "id": 492}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "152", "title": "第 152 條", "content": "以強暴脅迫或詐術，阻止或擾亂合法之集會者，處二年以下有期徒刑。", "id": 493}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "153", "title": "第 153 條", "content": "以文字、圖畫、演說或他法，公然為下列行為之一者，處二年以下有期徒刑、拘役或三萬元以下罰金：\n一、煽惑他人犯罪者。\n二、煽惑他人違背法令，或抗拒合法之命令者。", "id": 494}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "154", "title": "第 154 條", "content": "1 參與以犯罪為宗旨之結社者，處三年以下有期徒刑、拘役或一萬五千元以下罰金；首謀者，處一年以上七年以下有期徒刑。\n2 犯前項之罪而自首者，減輕或免除其刑。", "id": 495}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "155", "title": "第 155 條", "content": "煽惑軍人不執行職務，或不守紀律，或逃叛者，處六月以上五年以下有期徒刑。", "id": 496}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "156", "title": "第 156 條", "content": "未受允准，招集軍隊，發給軍需或率帶軍隊者，處五年以下有期徒刑。", "id": 497}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "157", "title": "第 157 條", "content": "意圖漁利，挑唆或包攬他人訴訟者，處一年以下有期徒刑、拘役或五萬元以下罰金。", "id": 498}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "158", "title": "第 158 條", "content": "1 冒充公務員而行使其職權者，處三年以下有期徒刑、拘役或一萬五千元以下罰金。\n2 冒充外國公務員而行使其職權者，亦同。", "id": 499}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "159", "title": "第 159 條", "content": "公然冒用公務員服飾、徽章或官銜者，處一萬五千元以下罰金。", "id": 500}, {"law": "中華民國刑法", "chapter": "第 七 章 妨害秩序罪", "num": "160", "title": "第 160 條", "content": "1 意圖侮辱中華民國，而公然損壞、除去或污辱中華民國之國徽、國旗者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 意圖侮辱創立中華民國之孫先生，而公然損壞、除去或污辱其遺像者，亦同。", "id": 501}, {"law": "中華民國刑法", "chapter": "第 八 章 脫逃罪", "num": "161", "title": "第 161 條", "content": "1 依法逮捕、拘禁之人脫逃者，處三年以下有期徒刑。\n2 損壞拘禁處所械具或以強暴脅迫犯前項之罪者，處一年以上七年以下有期徒刑。\n3 聚眾以強暴脅迫犯第一項之罪者，在場助勢之人，處三年以上十年以下有期徒刑。首謀及下手實施強暴脅迫者，處五年以上有期徒刑。\n4 前三項之未遂犯，罰之。", "id": 502}, {"law": "中華民國刑法", "chapter": "第 八 章 脫逃罪", "num": "161-1", "title": "第 161-1 條", "content": "經檢察官或法官命具保、責付、限制住居或限制出境、出海，經合法傳喚無正當理由不到庭，並經發布通緝者，處三年以下有期徒刑。", "id": 503}, {"law": "中華民國刑法", "chapter": "第 八 章 脫逃罪", "num": "162", "title": "第 162 條", "content": "1 縱放依法逮捕拘禁之人或便利其脫逃者，處三年以下有期徒刑。\n2 損壞拘禁處所械具或以強暴脅迫犯前項之罪者，處六月以上五年以下有期徒刑。\n3 聚眾以強暴脅迫犯第一項之罪者，在場助勢之人，處五年以上十二年以下有期徒刑；首謀及下手實施強暴脅迫者，處無期徒刑或七年以上有期徒刑。\n4 前三項之未遂犯罰之。\n5 配偶、五親等內之血親或三親等內之姻親，犯第一項之便利脫逃罪者，得減輕其刑。", "id": 504}, {"law": "中華民國刑法", "chapter": "第 八 章 脫逃罪", "num": "163", "title": "第 163 條", "content": "1 公務員縱放職務上依法逮捕、拘禁之人或便利其脫逃者，處一年以上七年以下有期徒刑。\n2 因過失致前項之人脫逃者，處六月以下有期徒刑、拘役或九千元以下罰金。\n3 第一項之未遂犯罰之。", "id": 505}, {"law": "中華民國刑法", "chapter": "第 九 章 藏匿人犯及湮滅證據罪", "num": "164", "title": "第 164 條", "content": "1 藏匿犯人或依法逮捕、拘禁之脫逃人或使之隱避者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。\n2 意圖犯前項之罪而頂替者，亦同。", "id": 506}, {"law": "中華民國刑法", "chapter": "第 九 章 藏匿人犯及湮滅證據罪", "num": "165", "title": "第 165 條", "content": "偽造、變造、湮滅或隱匿關係他人刑事被告案件之證據，或使用偽造、變造之證據者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 507}, {"law": "中華民國刑法", "chapter": "第 九 章 藏匿人犯及湮滅證據罪", "num": "166", "title": "第 166 條", "content": "犯前條之罪，於他人刑事被告案件裁判確定前自白者，減輕或免除其刑。", "id": 508}, {"law": "中華民國刑法", "chapter": "第 九 章 藏匿人犯及湮滅證據罪", "num": "167", "title": "第 167 條", "content": "配偶、五親等內之血親或三親等內之姻親圖利犯人或依法逮捕拘禁之脫逃人，而犯第一百六十四條或第一百六十五條之罪者，減輕或免除其刑。", "id": 509}, {"law": "中華民國刑法", "chapter": "第 十 章 偽證及誣告罪", "num": "168", "title": "第 168 條", "content": "於執行審判職務之公署審判時或於檢察官偵查時，證人、鑑定人、通譯於案情有重要關係之事項，供前或供後具結，而為虛偽陳述者，處七年以下有期徒刑。", "id": 510}, {"law": "中華民國刑法", "chapter": "第 十 章 偽證及誣告罪", "num": "169", "title": "第 169 條", "content": "1 意圖他人受刑事或懲戒處分，向該管公務員誣告者，處七年以下有期徒刑。\n2 意圖他人受刑事或懲戒處分，而偽造、變造證據，或使用偽造、變造之證據者，亦同。", "id": 511}, {"law": "中華民國刑法", "chapter": "第 十 章 偽證及誣告罪", "num": "170", "title": "第 170 條", "content": "意圖陷害直系血親尊親屬，而犯前條之罪者，加重其刑至二分之一。", "id": 512}, {"law": "中華民國刑法", "chapter": "第 十 章 偽證及誣告罪", "num": "171", "title": "第 171 條", "content": "1 未指定犯人，而向該管公務員誣告犯罪者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 未指定犯人，而偽造、變造犯罪證據，或使用偽造、變造之犯罪證據，致開始刑事訴訟程序者，亦同。", "id": 513}, {"law": "中華民國刑法", "chapter": "第 十 章 偽證及誣告罪", "num": "172", "title": "第 172 條", "content": "犯第一百六十八條至第一百七十一條之罪，於所虛偽陳述或所誣告之案件，裁判或懲戒處分確定前自白者，減輕或免除其刑。", "id": 514}, {"law": "中華民國刑法", "chapter": "第 十 章之一 妨害司法公正罪", "num": "172-1", "title": "第 172-1 條", "content": "1 對於證人、鑑定人、專家證人或通譯，行求、期約或交付不正利益，而約其不為證言、鑑定或傳譯，或約其為一定之證言、鑑定或傳譯者，處三年以下有期徒刑，得併科三十萬元以下罰金。\n2 證人、鑑定人、專家證人或通譯就證言、鑑定或傳譯之事項，要求、期約或收受不正利益者，亦同。", "id": 515}, {"law": "中華民國刑法", "chapter": "第 十 章之一 妨害司法公正罪", "num": "172-2", "title": "第 172-2 條", "content": "意圖使證人、鑑定人、專家證人或通譯不為證言、鑑定或傳譯，或使其為一定之證言、鑑定或傳譯，對其本人或其之配偶、直系血親、三親等內旁系血親、二親等內姻親或家長、家屬、與其訂有婚約者或其他身分上或生活上有密切利害關係之人，實行犯罪行為者，依其所犯之罪，加重其刑至二分之一。", "id": 516}, {"law": "中華民國刑法", "chapter": "第 十 章之一 妨害司法公正罪", "num": "172-3", "title": "第 172-3 條", "content": "1 意圖使法官、檢察官不為一定或為一定之裁判、處分、終結偵查、上訴、抗告或指揮執行之命令，在司法案件偵查、審判或執行中，利用職務、身分或地位之影響力對法官、檢察官或其指揮監督長官為不法關說者，處五年以下有期徒刑，得併科五十萬元以下罰金。\n2 前項法官、檢察官因而不為一定或為一定之裁判、處分、終結偵查、上訴、抗告或指揮執行之命令者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金。", "id": 517}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "173", "title": "第 173 條", "content": "1 放火燒燬現供人使用之住宅或現有人所在之建築物、礦坑、火車、電車或其他供水、陸、空公眾運輸之舟、車、航空機者，處無期徒刑或七年以上有期徒刑。\n2 失火燒燬前項之物者，處一年以下有期徒刑、拘役或一萬五千元以下罰金。\n3 第一項之未遂犯罰之。\n4 預備犯第一項之罪者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 518}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "174", "title": "第 174 條", "content": "1 放火燒燬現非供人使用之他人所有住宅或現未有人所在之他人所有建築物、礦坑、火車、電車或其他供水、陸、空公眾運輸之舟、車、航空機者，處三年以上十年以下有期徒刑。\n2 放火燒燬前項之自己所有物，致生公共危險者，處六月以上五年以下有期徒刑。\n3 失火燒燬第一項之物者，處六月以下有期徒刑、拘役或九千元以下罰金；失火燒燬前項之物，致生公共危險者，亦同。\n4 第一項之未遂犯罰之。", "id": 519}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "175", "title": "第 175 條", "content": "1 放火燒燬前二條以外之他人所有物，致生公共危險者，處一年以上七年以下有期徒刑。\n2 放火燒燬前二條以外之自己所有物，致生公共危險者，處三年以下有期徒刑。\n3 失火燒燬前二條以外之物，致生公共危險者，處拘役或九千元以下罰金。", "id": 520}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "176", "title": "第 176 條", "content": "故意或因過失，以火藥、蒸氣、電氣、煤氣或其他爆裂物，炸燬前三條之物者，準用各該條放火、失火之規定。", "id": 521}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "177", "title": "第 177 條", "content": "1 漏逸或間隔蒸氣、電氣、煤氣或其他氣體，致生公共危險者，處三年以下有期徒刑、拘役或九千元以下罰金。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "id": 522}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "178", "title": "第 178 條", "content": "1 決水浸害現供人使用之住宅或現有人所在之建築物、礦坑或火車、電車者，處無期徒刑或五年以上有期徒刑。\n2 因過失決水浸害前項之物者，處一年以下有期徒刑、拘役或一萬五千元以下罰金。\n3 第一項之未遂犯罰之。", "id": 523}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "179", "title": "第 179 條", "content": "1 決水浸害現非供人使用之他人所有住宅或現未有人所在之他人所有建築物或礦坑者，處一年以上七年以下有期徒刑。\n2 決水浸害前項之自己所有物，致生公共危險者，處六月以上五年以下有期徒刑。\n3 因過失決水浸害第一項之物者，處六月以下有期徒刑、拘役或九千元以下罰金。\n4 因過失決水浸害前項之物，致生公共危險者，亦同。\n5 第一項之未遂犯罰之。", "id": 524}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "180", "title": "第 180 條", "content": "1 決水浸害前二條以外之他人所有物，致生公共危險者，處五年以下有期徒刑。\n2 決水浸害前二條以外之自己所有物，致生公共危險者，處二年以下有期徒刑。\n3 因過失決水浸害前二條以外之物，致生公共危險者，處拘役或九千元以下罰金。", "id": 525}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "181", "title": "第 181 條", "content": "1 決潰隄防、破壞水閘或損壞自來水池，致生公共危險者，處五年以下有期徒刑。\n2 因過失犯前項之罪者，處拘役或九千元以下罰金。\n3 第一項之未遂犯罰之。", "id": 526}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "182", "title": "第 182 條", "content": "於火災、水災、風災、震災、爆炸或其他相類災害發生之際，隱匿或損壞防禦之器械或以他法妨害救災者，處三年以下有期徒刑、拘役或三萬元以下罰金。", "id": 527}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "183", "title": "第 183 條", "content": "1 傾覆或破壞現有人所在之火車、電車或其他供水、陸、空公眾運輸之舟、車、航空機者，處無期徒刑或五年以上有期徒刑。\n2 因過失犯前項之罪者，處三年以下有期徒刑、拘役或三十萬元以下罰金。\n3 第一項之未遂犯罰之。", "id": 528}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "184", "title": "第 184 條", "content": "1 損壞軌道、燈塔、標識或以他法致生火車、電車或其他供水、陸、空公眾運輸之舟、車、航空機往來之危險者，處三年以上十年以下有期徒刑。\n2 因而致前項之舟、車、航空機傾覆或破壞者，依前條第一項之規定處斷。\n3 因過失犯第一項之罪者，處二年以下有期徒刑、拘役或二十萬元以下罰金。\n4 第一項之未遂犯罰之。", "id": 529}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "185", "title": "第 185 條", "content": "1 損壞或壅塞陸路、水路、橋樑或其他公眾往來之設備或以他法致生往來之危險者，處五年以下有期徒刑、拘役或一萬五千元以下罰金。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 530}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "185-1", "title": "第 185-1 條", "content": "1 以強暴、脅迫或其他非法方法劫持使用中之航空器或控制其飛航者，處死刑、無期徒刑或七年以上有期徒刑。其情節輕微者，處七年以下有期徒刑。\n2 因而致人於死者，處死刑或無期徒刑；致重傷者，處死刑、無期徒刑或十年以上有期徒刑。\n3 以第一項之方法劫持使用中供公眾運輸之舟、車或控制其行駛者，處五年以上有期徒刑。其情節輕微者，處三年以下有期徒刑。\n4 因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處七年以上有期徒刑。\n5 第一項、第三項之未遂犯罰之。\n6 預備犯第一項之罪者，處三年以下有期徒刑。", "id": 531}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "185-2", "title": "第 185-2 條", "content": "1 以強暴、脅迫或其他非法方法危害飛航安全或其設施者，處七年以下有期徒刑、拘役或九十萬元以下罰金。\n2 因而致航空器或其他設施毀損者，處三年以上十年以下有期徒刑。\n3 因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n4 第一項之未遂犯罰之。", "id": 532}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "185-3", "title": "第 185-3 條", "content": "1 駕駛動力交通工具而有下列情形之一者，處三年以下有期徒刑，得併科三十萬元以下罰金：\n一、吐氣所含酒精濃度達每公升零點二五毫克或血液中酒精濃度達百分之零點零五以上。\n二、有前款以外之其他情事足認服用酒類或其他相類之物，致不能安全駕駛。\n三、尿液或血液所含毒品、麻醉藥品或其他相類之物或其代謝物達行政院公告之品項及濃度值以上。\n四、有前款以外之其他情事足認施用毒品、麻醉藥品或其他相類之物，致不能安全駕駛。\n2 因而致人於死者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金；致重傷者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金。\n3 曾犯本條或陸海空軍刑法第五十四條之罪，經有罪判決確定或經緩起訴處分確定，於十年內再犯第一項之罪因而致人於死者，處無期徒刑或五年以上有期徒刑，得併科三百萬元以下罰金；致重傷者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金。", "id": 533}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "185-4", "title": "第 185-4 條", "content": "1 駕駛動力交通工具發生交通事故，致人傷害而逃逸者，處六月以上五年以下有期徒刑；致人於死或重傷而逃逸者，處一年以上七年以下有期徒刑。\n2 犯前項之罪，駕駛人於發生交通事故致人死傷係無過失者，減輕或免除其刑。", "id": 534}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "186", "title": "第 186 條", "content": "未受允准，而製造、販賣、運輸或持有炸藥、棉花藥、雷汞或其他相類之爆裂物或軍用槍砲、子彈而無正當理由者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 535}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "186-1", "title": "第 186-1 條", "content": "1 無正當理由使用炸藥、棉花藥、雷汞或其他相類之爆裂物爆炸，致生公共危險者，處一年以上七年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n3 因過失致炸藥、棉花藥、雷汞或其他相類之爆裂物爆炸而生公共危險者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。\n4 第一項之未遂犯罰之。", "id": 536}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "187", "title": "第 187 條", "content": "意圖供自己或他人犯罪之用，而製造、販賣、運輸或持有炸藥、棉花藥、雷汞或其他相類之爆裂物或軍用槍砲、子彈者，處五年以下有期徒刑。", "id": 537}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "187-1", "title": "第 187-1 條", "content": "不依法令製造、販賣、運輸或持有核子原料、燃料、反應器、放射性物質或其原料者，處五年以下有期徒刑。", "id": 538}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "187-2", "title": "第 187-2 條", "content": "1 放逸核能、放射線，致生公共危險者，處五年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上有期徒刑。\n3 因過失犯第一項之罪者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。\n4 第一項之未遂犯罰之。", "id": 539}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "187-3", "title": "第 187-3 條", "content": "1 無正當理由使用放射線，致傷害人之身體或健康者，處三年以上十年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上有期徒刑。\n3 第一項之未遂犯罰之。", "id": 540}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "188", "title": "第 188 條", "content": "妨害鐵路、郵務、電報、電話或供公眾之用水、電氣、煤氣事業者，處五年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 541}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "189", "title": "第 189 條", "content": "1 損壞礦坑、工廠或其他相類之場所內關於保護生命之設備，致生危險於他人生命者，處一年以上七年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n3 因過失犯第一項之罪者，處二年以下有期徒刑、拘役或二十萬元以下罰金。\n4 第一項之未遂犯罰之。", "id": 542}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "189-1", "title": "第 189-1 條", "content": "1 損壞礦場、工廠或其他相類之場所內關於保護生命之設備或致令不堪用，致生危險於他人之身體健康者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 損壞前項以外之公共場所內關於保護生命之設備或致令不堪用，致生危險於他人之身體健康者，亦同。", "id": 543}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "189-2", "title": "第 189-2 條", "content": "1 阻塞戲院、商場、餐廳、旅店或其他公眾得出入之場所或公共場所之逃生通道，致生危險於他人生命、身體或健康者，處三年以下有期徒刑。阻塞集合住宅或共同使用大廈之逃生通道，致生危險於他人生命、身體或健康者，亦同。\n2 因而致人於死者，處七年以下有期徒刑；致重傷者，處五年以下有期徒刑。", "id": 544}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "190", "title": "第 190 條", "content": "1 投放毒物或混入妨害衛生物品於供公眾所飲之水源、水道或自來水池者，處一年以上七年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n3 因過失犯第一項之罪者，處六月以下有期徒刑、拘役或九千元以下罰金。\n4 第一項之未遂犯罰之。", "id": 545}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "190-1", "title": "第 190-1 條", "content": "1 投棄、放流、排出、放逸或以他法使毒物或其他有害健康之物污染空氣、土壤、河川或其他水體者，處五年以下有期徒刑、拘役或科或併科一千萬元以下罰金。\n2 廠商或事業場所之負責人、監督策劃人員、代理人、受僱人或其他從業人員，因事業活動而犯前項之罪者，處七年以下有期徒刑，得併科一千五百萬元以下罰金。\n3 犯第一項之罪，因而致人於死者，處三年以上十年以下有期徒刑；致重傷者，處一年以上七年以下有期徒刑。\n4 犯第二項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n5 因過失犯第一項之罪者，處一年以下有期徒刑、拘役或科或併科二百萬元以下罰金。\n6 因過失犯第二項之罪者，處三年以下有期徒刑、拘役或科或併科六百萬元以下罰金。\n7 第一項或第二項之未遂犯罰之。\n8 犯第一項、第五項或第一項未遂犯之罪，其情節顯著輕微者，不罰。", "id": 546}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "191", "title": "第 191 條", "content": "製造、販賣或意圖販賣而陳列妨害衛生之飲食物品或其他物品者，處六月以下有期徒刑、拘役或科或併科三萬元以下罰金。", "id": 547}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "191-1", "title": "第 191-1 條", "content": "1 對他人公開陳列、販賣之飲食物品或其他物品滲入、添加或塗抹毒物或其他有害人體健康之物質者，處七年以下有期徒刑。\n2 將已滲入、添加或塗抹毒物或其他有害人體健康之飲食物品或其他物品混雜於公開陳列、販賣之飲食物品或其他物品者，亦同。\n3 犯前二項之罪而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n4 第一項及第二項之未遂犯罰之。", "id": 548}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "192", "title": "第 192 條", "content": "1 違背關於預防傳染病所公布之檢查或進口之法令者，處二年以下有期徒刑、拘役或三萬元以下罰金。\n2 暴露有傳染病菌之屍體，或以他法散布病菌，致生公共危險者，亦同。", "id": 549}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "193", "title": "第 193 條", "content": "承攬工程人或監工人於營造或拆卸建築物時，違背建築術成規，致生公共危險者，處三年以下有期徒刑、拘役或九萬元以下罰金。", "id": 550}, {"law": "中華民國刑法", "chapter": "第 十一 章 公共危險罪", "num": "194", "title": "第 194 條", "content": "於災害之際，關於與公務員或慈善團體締結供給糧食或其他必需品之契約，而不履行或不照契約履行，致生公共危險者，處五年以下有期徒刑，得併科九萬元以下罰金。", "id": 551}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "195", "title": "第 195 條", "content": "1 意圖供行使之用，而偽造、變造通用之貨幣、紙幣、銀行券者，處五年以上有期徒刑，得併科十五萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 552}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "196", "title": "第 196 條", "content": "1 行使偽造、變造之通用貨幣、紙幣、銀行券，或意圖供行使之用而收集或交付於人者，處三年以上十年以下有期徒刑，得併科十五萬元以下罰金。\n2 收受後方知為偽造、變造之通用貨幣、紙幣、銀行券而仍行使，或意圖供行使之用而交付於人者，處一萬五千元以下罰金。\n3 第一項之未遂犯罰之。", "id": 553}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "197", "title": "第 197 條", "content": "1 意圖供行使之用而減損通用貨幣之分量者，處五年以下有期徒刑，得併科九萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 554}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "198", "title": "第 198 條", "content": "1 行使減損分量之通用貨幣，或意圖供行使之用而收集或交付於人者，處三年以下有期徒刑，得併科三萬元以下罰金。\n2 收受後方知為減損分量之通用貨幣而仍行使，或意圖供行使之用而交付於人者，處三千元以下罰金。\n3 第一項之未遂犯罰之。", "id": 555}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "199", "title": "第 199 條", "content": "意圖供偽造、變造通用之貨幣、紙幣、銀行券或意圖供減損通用貨幣分量之用，而製造、交付或收受各項器械、原料者，處五年以下有期徒刑，得併科三萬元以下罰金。", "id": 556}, {"law": "中華民國刑法", "chapter": "第 十二 章 偽造貨幣罪", "num": "200", "title": "第 200 條", "content": "偽造、變造之通用貨幣、紙幣、銀行券，減損分量之通用貨幣及前條之器械原料，不問屬於犯人與否，沒收之。", "id": 557}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "201", "title": "第 201 條", "content": "1 意圖供行使之用，而偽造、變造公債票、公司股票或其他有價證券者，處三年以上十年以下有期徒刑，得併科九萬元以下罰金。\n2 行使偽造、變造之公債票、公司股票或其他有價證券，或意圖供行使之用而收集或交付於人者，處一年以上七年以下有期徒刑，得併科九萬元以下罰金。", "id": 558}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "201-1", "title": "第 201-1 條", "content": "1 意圖供行使之用，而偽造、變造信用卡、金融卡、儲值卡或其他相類作為簽帳、提款、轉帳或支付工具之電磁紀錄物者，處一年以上七年以下有期徒刑，得併科九萬元以下罰金。\n2 行使前項偽造、變造之信用卡、金融卡、儲值卡或其他相類作為簽帳、提款、轉帳或支付工具之電磁紀錄物，或意圖供行使之用，而收受或交付於人者，處五年以下有期徒刑，得併科九萬元以下罰金。", "id": 559}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "202", "title": "第 202 條", "content": "1 意圖供行使之用，而偽造、變造郵票或印花稅票者，處六月以上五年以下有期徒刑，得併科三萬元以下罰金。\n2 行使偽造、變造之郵票或印花稅票，或意圖供行使之用而收集或交付於人者，處三年以下有期徒刑，得併科三萬元以下罰金。\n3 意圖供行使之用，而塗抹郵票或印花稅票上之註銷符號者，處一年以下有期徒刑、拘役或九千元以下罰金；其行使之者，亦同。", "id": 560}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "203", "title": "第 203 條", "content": "意圖供行使之用，而偽造、變造船票、火車、電車票或其他往來客票者，處一年以下有期徒刑、拘役或九千元以下罰金；其行使之者，亦同。", "id": 561}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "204", "title": "第 204 條", "content": "1 意圖供偽造、變造有價證券、郵票、印花稅票、信用卡、金融卡、儲值卡或其他相類作為簽帳、提款、轉帳或支付工具之電磁紀錄物之用，而製造、交付或收受各項器械、原料、或電磁紀錄者，處二年以下有期徒刑，得併科一萬五千元以下罰金。\n2 從事業務之人利用職務上機會犯前項之罪者，加重其刑至二分之一。", "id": 562}, {"law": "中華民國刑法", "chapter": "第 十三 章 偽造有價證券罪", "num": "205", "title": "第 205 條", "content": "偽造、變造之有價證券、郵票、印花稅票、信用卡、金融卡、儲值卡或其他相類作為提款、簽帳、轉帳或支付工具之電磁紀錄物及前條之器械原料及電磁紀錄，不問屬於犯人與否，沒收之。", "id": 563}, {"law": "中華民國刑法", "chapter": "第 十四 章 偽造度量衡罪", "num": "206", "title": "第 206 條", "content": "意圖供行使之用，而製造違背定程之度量衡，或變更度量衡之定程者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 564}, {"law": "中華民國刑法", "chapter": "第 十四 章 偽造度量衡罪", "num": "207", "title": "第 207 條", "content": "意圖供行使之用，而販賣違背定程之度量衡者，處六月以下有期徒刑、拘役或九千元以下罰金。", "id": 565}, {"law": "中華民國刑法", "chapter": "第 十四 章 偽造度量衡罪", "num": "208", "title": "第 208 條", "content": "1 行使違背定程之度量衡者，處九千元以下罰金。\n2 從事業務之人，關於其業務犯前項之罪者，處六月以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 566}, {"law": "中華民國刑法", "chapter": "第 十四 章 偽造度量衡罪", "num": "209", "title": "第 209 條", "content": "違背定程之度量衡，不問屬於犯人與否，沒收之。", "id": 567}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "210", "title": "第 210 條", "content": "偽造、變造私文書，足以生損害於公眾或他人者，處五年以下有期徒刑。", "id": 568}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "211", "title": "第 211 條", "content": "偽造、變造公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑。", "id": 569}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "212", "title": "第 212 條", "content": "偽造、變造護照、旅券、免許證、特許證及關於品行、能力、服務或其他相類之證書、介紹書，足以生損害於公眾或他人者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 570}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "213", "title": "第 213 條", "content": "公務員明知為不實之事項，而登載於職務上所掌之公文書，足以生損害於公眾或他人者，處一年以上七年以下有期徒刑。", "id": 571}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "214", "title": "第 214 條", "content": "明知為不實之事項，而使公務員登載於職務上所掌之公文書，足以生損害於公眾或他人者，處三年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 572}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "215", "title": "第 215 條", "content": "從事業務之人，明知為不實之事項，而登載於其業務上作成之文書，足以生損害於公眾或他人者，處三年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 573}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "216", "title": "第 216 條", "content": "行使第二百一十條至第二百一十五條之文書者，依偽造、變造文書或登載不實事項或使登載不實事項之規定處斷。", "id": 574}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "217", "title": "第 217 條", "content": "1 偽造印章、印文或署押，足以生損害於公眾或他人者，處三年以下有期徒刑。\n2 盜用印章、印文或署押，足以生損害於公眾或他人者，亦同。", "id": 575}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "218", "title": "第 218 條", "content": "1 偽造公印或公印文者，處五年以下有期徒刑。\n2 盜用公印或公印文足以生損害於公眾或他人者，亦同。", "id": 576}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "219", "title": "第 219 條", "content": "偽造之印章、印文或署押，不問屬於犯人與否，沒收之。", "id": 577}, {"law": "中華民國刑法", "chapter": "第 十五 章 偽造文書印文罪", "num": "220", "title": "第 220 條", "content": "1 在紙上或物品上之文字、符號、圖畫、照像，依習慣或特約，足以為表示其用意之證明者，關於本章及本章以外各罪，以文書論。\n2 錄音、錄影或電磁紀錄，藉機器或電腦之處理所顯示之聲音、影像或符號，足以為表示其用意之證明者，亦同。", "id": 578}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "221", "title": "第 221 條", "content": "1 對於男女以強暴、脅迫、恐嚇、催眠術或其他違反其意願之方法而為性交者，處三年以上十年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 579}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "222", "title": "第 222 條", "content": "1 犯前條之罪而有下列情形之一者，處七年以上有期徒刑：\n一、二人以上共同犯之。\n二、對未滿十四歲之男女犯之。\n三、對精神、身體障礙或其他心智缺陷之人犯之。\n四、以藥劑犯之。\n五、對被害人施以凌虐。\n六、利用駕駛供公眾或不特定人運輸之交通工具之機會犯之。\n七、侵入住宅或有人居住之建築物、船艦或隱匿其內犯之。\n八、攜帶兇器犯之。\n九、對被害人為照相、錄音、錄影或散布、播送該影像、聲音、電磁紀錄。\n2 前項之未遂犯罰之。", "id": 580}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "223", "title": "第 223 條", "content": "（刪除）", "id": 581}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "224", "title": "第 224 條", "content": "對於男女以強暴、脅迫、恐嚇、催眠術或其他違反其意願之方法，而為猥褻之行為者，處六月以上五年以下有期徒刑。", "id": 582}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "224-1", "title": "第 224-1 條", "content": "犯前條之罪而有第二百二十二條第一項各款情形之一者，處三年以上十年以下有期徒刑。", "id": 583}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "225", "title": "第 225 條", "content": "1 對於男女利用其精神、身體障礙、心智缺陷或其他相類之情形，不能或不知抗拒而為性交者，處三年以上十年以下有期徒刑。\n2 對於男女利用其精神、身體障礙、心智缺陷或其他相類之情形，不能或不知抗拒而為猥褻之行為者，處六月以上五年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 584}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "226", "title": "第 226 條", "content": "1 犯第二百二十一條、第二百二十二條、第二百二十四條、第二百二十四條之一或第二百二十五條之罪，因而致被害人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n2 因而致被害人羞忿自殺或意圖自殺而致重傷者，處十年以上有期徒刑。", "id": 585}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "226-1", "title": "第 226-1 條", "content": "犯第二百二十一條、第二百二十二條、第二百二十四條、第二百二十四條之一或第二百二十五條之罪，而故意殺害被害人者，處死刑或無期徒刑；使被害人受重傷者，處無期徒刑或十年以上有期徒刑。", "id": 586}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "227", "title": "第 227 條", "content": "1 對於未滿十四歲之男女為性交者，處三年以上十年以下有期徒刑。\n2 對於未滿十四歲之男女為猥褻之行為者，處六月以上五年以下有期徒刑。\n3 對於十四歲以上未滿十六歲之男女為性交者，處七年以下有期徒刑。\n4 對於十四歲以上未滿十六歲之男女為猥褻之行為者，處三年以下有期徒刑。\n5 第一項、第三項之未遂犯罰之。", "id": 587}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "227-1", "title": "第 227-1 條", "content": "十八歲以下之人犯前條之罪者，減輕或免除其刑。", "id": 588}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "228", "title": "第 228 條", "content": "1 對於因親屬、監護、教養、教育、訓練、救濟、醫療、公務、業務或其他相類關係受自己監督、扶助、照護之人，利用權勢或機會為性交者，處六月以上五年以下有期徒刑。\n2 因前項情形而為猥褻之行為者，處三年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 589}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "229", "title": "第 229 條", "content": "1 以詐術使男女誤信為自己配偶，而聽從其為性交者，處三年以上十年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 590}, {"law": "中華民國刑法", "chapter": "第 十六 章 妨害性自主罪", "num": "229-1", "title": "第 229-1 條", "content": "對配偶犯第二百二十一條、第二百二十四條之罪者，或未滿十八歲之人犯第二百二十七條之罪者，須告訴乃論。", "id": 591}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "230", "title": "第 230 條", "content": "與直系或三親等內旁系血親為性交者，處五年以下有期徒刑。", "id": 592}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "231", "title": "第 231 條", "content": "1 意圖使男女與他人為性交或猥褻之行為，而引誘、容留或媒介以營利者，處五年以下有期徒刑，得併科十萬元以下罰金。以詐術犯之者，亦同。\n2 公務員包庇他人犯前項之罪者，依前項之規定加重其刑至二分之一。", "id": 593}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "231-1", "title": "第 231-1 條", "content": "1 意圖營利，以強暴、脅迫、恐嚇、監控、藥劑、催眠術或其他違反本人意願之方法使男女與他人為性交或猥褻之行為者，處七年以上有期徒刑，得併科三十萬元以下罰金。\n2 媒介、收受、藏匿前項之人或使之隱避者，處一年以上七年以下有期徒刑。\n3 公務員包庇他人犯前二項之罪者，依各該項之規定加重其刑至二分之一。\n4 第一項之未遂犯罰之。", "id": 594}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "232", "title": "第 232 條", "content": "對於第二百二十八條所定受自己監督、扶助、照護之人，或夫對於妻，犯第二百三十一條第一項、第二百三十一條之一第一項、第二項之罪者，依各該條項之規定加重其刑至二分之一。", "id": 595}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "233", "title": "第 233 條", "content": "1 意圖使未滿十六歲之男女與他人為性交或猥褻之行為，而引誘、容留或媒介之者，處五年以下有期徒刑、拘役或一萬五千元以下罰金。以詐術犯之者，亦同。\n2 意圖營利犯前項之罪者，處一年以上七年以下有期徒刑，得併科十五萬元以下罰金。", "id": 596}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "234", "title": "第 234 條", "content": "1 意圖供人觀覽，公然為猥褻之行為者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 意圖營利犯前項之罪者，處二年以下有期徒刑、拘役或科或併科三萬元以下罰金。", "id": 597}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "235", "title": "第 235 條", "content": "1 散布、播送或販賣猥褻之文字、圖畫、聲音、影像或其他物品，或公然陳列，或以他法供人觀覽、聽聞者，處二年以下有期徒刑、拘役或科或併科九萬元以下罰金。\n2 意圖散布、播送、販賣而製造、持有前項文字、圖畫、聲音、影像及其附著物或其他物品者，亦同。\n3 前二項之文字、圖畫、聲音或影像之附著物及物品，不問屬於犯人與否，沒收之。", "id": 598}, {"law": "中華民國刑法", "chapter": "第 十六 章之一 妨害風化罪", "num": "236", "title": "第 236 條", "content": "第二百三十條之罪，須告訴乃論。", "id": 599}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "237", "title": "第 237 條", "content": "有配偶而重為婚姻或同時與二人以上結婚者，處五年以下有期徒刑。其相婚者亦同。", "id": 600}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "238", "title": "第 238 條", "content": "以詐術締結無效或得撤銷之婚姻，因而致婚姻無效之裁判或撤銷婚姻之裁判確定者，處三年以下有期徒刑。", "id": 601}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "239", "title": "第 239 條", "content": "（刪除）", "id": 602}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "240", "title": "第 240 條", "content": "1 和誘未成年人脫離家庭或其他有監督權之人者，處三年以下有期徒刑。\n2 和誘有配偶之人脫離家庭者，亦同。\n3 意圖營利，或意圖使被誘人為猥褻之行為或性交，而犯前二項之罪者，處六月以上五年以下有期徒刑，得併科五十萬元以下罰金。\n4 前三項之未遂犯罰之。", "id": 603}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "241", "title": "第 241 條", "content": "1 略誘未成年人脫離家庭或其他有監督權之人者，處一年以上七年以下有期徒刑。\n2 意圖營利，或意圖使被誘人為猥褻之行為或性交，而犯前項之罪者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金。\n3 和誘未滿十六歲之人，以略誘論。\n4 前三項之未遂犯罰之。", "id": 604}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "242", "title": "第 242 條", "content": "1 移送前二條之被誘人出中華民國領域外者，處無期徒刑或七年以上有期徒刑。\n2 前項之未遂犯罰之。", "id": 605}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "243", "title": "第 243 條", "content": "1 意圖營利、或意圖使第二百四十條或第二百四十一條之被誘人為猥褻之行為或性交，而收受、藏匿被誘人或使之隱避者，處六月以上五年以下有期徒刑，得併科一萬五千元以下罰金。\n2 前項之未遂犯罰之。", "id": 606}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "244", "title": "第 244 條", "content": "犯第二百四十條至第二百四十三條之罪，於裁判宣告前送回被誘人或指明所在地因而尋獲者，得減輕其刑。", "id": 607}, {"law": "中華民國刑法", "chapter": "第 十七 章 妨害婚姻及家庭罪", "num": "245", "title": "第 245 條", "content": "第二百三十八條、第二百四十條第二項之罪，須告訴乃論。", "id": 608}, {"law": "中華民國刑法", "chapter": "第 十八 章 褻瀆祀典及侵害墳墓屍體罪", "num": "246", "title": "第 246 條", "content": "1 對於壇廟、寺觀、教堂、墳墓或公眾紀念處所公然侮辱者，處六月以下有期徒刑、拘役或九千元以下罰金。\n2 妨害喪、葬、祭禮、說教、禮拜者，亦同。", "id": 609}, {"law": "中華民國刑法", "chapter": "第 十八 章 褻瀆祀典及侵害墳墓屍體罪", "num": "247", "title": "第 247 條", "content": "1 損壞、遺棄、污辱或盜取屍體者，處六月以上五年以下有期徒刑。\n2 損壞、遺棄或盜取遺骨、遺髮、殮物或火葬之遺灰者，處五年以下有期徒刑。\n3 前二項之未遂犯罰之。", "id": 610}, {"law": "中華民國刑法", "chapter": "第 十八 章 褻瀆祀典及侵害墳墓屍體罪", "num": "248", "title": "第 248 條", "content": "1 發掘墳墓者，處六月以上五年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 611}, {"law": "中華民國刑法", "chapter": "第 十八 章 褻瀆祀典及侵害墳墓屍體罪", "num": "249", "title": "第 249 條", "content": "1 發掘墳墓而損壞、遺棄、污辱或盜取屍體者，處三年以上十年以下有期徒刑。\n2 發掘墳墓而損壞、遺棄或盜取遺骨、遺髮、殮物或火葬之遺灰者，處一年以上七年以下有期徒刑。", "id": 612}, {"law": "中華民國刑法", "chapter": "第 十八 章 褻瀆祀典及侵害墳墓屍體罪", "num": "250", "title": "第 250 條", "content": "對於直系血親尊親屬犯第二百四十七條至第二百四十九條之罪者，加重其刑至二分之一。", "id": 613}, {"law": "中華民國刑法", "chapter": "第 十九 章 妨害農工商罪", "num": "251", "title": "第 251 條", "content": "1 意圖抬高交易價格，囤積下列物品之一，無正當理由不應市銷售者，處三年以下有期徒刑、拘役或科或併科三十萬元以下罰金：\n一、糧食、農產品或其他民生必需之飲食物品。\n二、種苗、肥料、原料或其他農業、工業必需之物品。\n三、前二款以外，經行政院公告之生活必需用品。\n2 以強暴、脅迫妨害前項物品之販運者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n3 意圖影響第一項物品之交易價格，而散布不實資訊者，處二年以下有期徒刑、拘役或科或併科二十萬元以下罰金。\n4 以廣播電視、電子通訊、網際網路或其他傳播工具犯前項之罪者，得加重其刑至二分之一。\n5 第二項之未遂犯罰之。", "id": 614}, {"law": "中華民國刑法", "chapter": "第 十九 章 妨害農工商罪", "num": "252", "title": "第 252 條", "content": "意圖加損害於他人而妨害其農事上之水利者，處二年以下有期徒刑、拘役或九千元以下罰金。", "id": 615}, {"law": "中華民國刑法", "chapter": "第 十九 章 妨害農工商罪", "num": "253", "title": "第 253 條", "content": "意圖欺騙他人而偽造或仿造已登記之商標、商號者，處二年以下有期徒刑、拘役或科或併科九萬元以下罰金。", "id": 616}, {"law": "中華民國刑法", "chapter": "第 十九 章 妨害農工商罪", "num": "254", "title": "第 254 條", "content": "明知為偽造或仿造之商標、商號之貨物而販賣，或意圖販賣而陳列，或自外國輸入者，處六萬元以下罰金。", "id": 617}, {"law": "中華民國刑法", "chapter": "第 十九 章 妨害農工商罪", "num": "255", "title": "第 255 條", "content": "1 意圖欺騙他人，而就商品之原產國或品質，為虛偽之標記或其他表示者，處一年以下有期徒刑、拘役或三萬元以下罰金。\n2 明知為前項商品而販賣，或意圖販賣而陳列，或自外國輸入者，亦同。", "id": 618}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "256", "title": "第 256 條", "content": "1 製造鴉片者，處七年以下有期徒刑，得併科九萬元以下罰金。\n2 製造嗎啡、高根、海洛因或其化合質料者，處無期徒刑或五年以上有期徒刑，得併科十五萬元以下罰金。\n3 前二項之未遂犯罰之。", "id": 619}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "257", "title": "第 257 條", "content": "1 販賣或運輸鴉片者，處七年以下有期徒刑，得併科九萬元以下罰金。\n2 販賣或運輸嗎啡、高根、海洛因或其化合質料者，處三年以上十年以下有期徒刑，得併科十五萬元以下罰金。\n3 自外國輸入前二項之物者，處無期徒刑或五年以上有期徒刑，得併科三十萬元以下罰金。\n4 前三項之未遂犯罰之。", "id": 620}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "258", "title": "第 258 條", "content": "1 製造、販賣或運輸專供吸食鴉片之器具者，處三年以下有期徒刑，得併科一萬五千元以下罰金。\n2 前項之未遂犯罰之。", "id": 621}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "259", "title": "第 259 條", "content": "1 意圖營利，為人施打嗎啡或以館舍供人吸食鴉片或其化合質料者，處一年以上七年以下有期徒刑，得併科三萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 622}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "260", "title": "第 260 條", "content": "1 意圖供製造鴉片、嗎啡之用而栽種罌粟者，處五年以下有期徒刑，得併科九萬元以下罰金。\n2 意圖供製造鴉片、嗎啡之用而販賣或運輸罌粟種子者，處三年以下有期徒刑，得併科九萬元以下罰金。\n3 前二項之未遂犯罰之。", "id": 623}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "261", "title": "第 261 條", "content": "公務員利用權力強迫他人犯前條之罪者，處死刑或無期徒刑。", "id": 624}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "262", "title": "第 262 條", "content": "吸食鴉片或施打嗎啡或使用高根、海洛因或其化合質料者，處六月以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 625}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "263", "title": "第 263 條", "content": "意圖供犯本章各罪之用，而持有鴉片、嗎啡、高根、海洛因或其化合質料，或專供吸食鴉片之器具者，處拘役或一萬五千元以下罰金。", "id": 626}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "264", "title": "第 264 條", "content": "公務員包庇他人犯本章各條之罪者，依各該條之規定，加重其刑至二分之一。", "id": 627}, {"law": "中華民國刑法", "chapter": "第 二十 章 鴉片罪", "num": "265", "title": "第 265 條", "content": "犯本章各條之罪者，其鴉片、嗎啡、高根、海洛因或其化合質料，或種子或專供吸食鴉片之器具，不問屬於犯人與否，沒收之。", "id": 628}, {"law": "中華民國刑法", "chapter": "第 二十一 章 賭博罪", "num": "266", "title": "第 266 條", "content": "1 在公共場所或公眾得出入之場所賭博財物者，處五萬元以下罰金。\n2 以電信設備、電子通訊、網際網路或其他相類之方法賭博財物者，亦同。\n3 前二項以供人暫時娛樂之物為賭者，不在此限。\n4 犯第一項之罪，當場賭博之器具、彩券與在賭檯或兌換籌碼處之財物，不問屬於犯罪行為人與否，沒收之。", "id": 629}, {"law": "中華民國刑法", "chapter": "第 二十一 章 賭博罪", "num": "267", "title": "第 267 條", "content": "（刪除）", "id": 630}, {"law": "中華民國刑法", "chapter": "第 二十一 章 賭博罪", "num": "268", "title": "第 268 條", "content": "意圖營利，供給賭博場所或聚眾賭博者，處三年以下有期徒刑，得併科九萬元以下罰金。", "id": 631}, {"law": "中華民國刑法", "chapter": "第 二十一 章 賭博罪", "num": "269", "title": "第 269 條", "content": "1 意圖營利，辦理有獎儲蓄或未經政府允准而發行彩票者，處一年以下有期徒刑或拘役，得併科九萬元以下罰金。\n2 經營前項有獎儲蓄或為買賣前項彩票之媒介者，處六月以下有期徒刑、拘役或科或併科三萬元以下罰金。", "id": 632}, {"law": "中華民國刑法", "chapter": "第 二十一 章 賭博罪", "num": "270", "title": "第 270 條", "content": "公務員包庇他人犯本章各條之罪者，依各該條之規定，加重其刑至二分之一。", "id": 633}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "271", "title": "第 271 條", "content": "1 殺人者，處死刑、無期徒刑或十年以上有期徒刑。\n2 前項之未遂犯罰之。\n3 預備犯第一項之罪者，處二年以下有期徒刑。", "id": 634}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "272", "title": "第 272 條", "content": "對於直系血親尊親屬，犯前條之罪者，加重其刑至二分之一。", "id": 635}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "272-1", "title": "第 272-1 條", "content": "1 對於未滿七歲之人犯第二百七十一條之罪者，加重其刑二分之一。\n2 對於未滿七歲之人，以凌虐方式犯第二百七十一條第一項之罪者，處死刑或無期徒刑。\n3 前項之未遂犯罰之。\n4 預備犯第二項之罪者，處五年以下有期徒刑。", "id": 636}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "273", "title": "第 273 條", "content": "1 當場激於義憤而殺人者，處七年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 637}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "274", "title": "第 274 條", "content": "1 母因不得已之事由，於生產時或甫生產後，殺其子女者，處六月以上五年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 638}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "275", "title": "第 275 條", "content": "1 受他人囑託或得其承諾而殺之者，處一年以上七年以下有期徒刑。\n2 教唆或幫助他人使之自殺者，處五年以下有期徒刑。\n3 前二項之未遂犯罰之。\n4 謀為同死而犯前三項之罪者，得免除其刑。", "id": 639}, {"law": "中華民國刑法", "chapter": "第 二十二 章 殺人罪", "num": "276", "title": "第 276 條", "content": "因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。", "id": 640}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "277", "title": "第 277 條", "content": "1 傷害人之身體或健康者，處五年以下有期徒刑、拘役或五十萬元以下罰金。\n2 犯前項之罪，因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "id": 641}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "278", "title": "第 278 條", "content": "1 使人受重傷者，處五年以上十二年以下有期徒刑。\n2 犯前項之罪因而致人於死者，處無期徒刑或十年以上有期徒刑。\n3 第一項之未遂犯罰之。", "id": 642}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "279", "title": "第 279 條", "content": "當場激於義憤犯前二條之罪者，處二年以下有期徒刑、拘役或二十萬元以下罰金。但致人於死者，處五年以下有期徒刑。", "id": 643}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "280", "title": "第 280 條", "content": "對於直系血親尊親屬，犯第二百七十七條或第二百七十八條之罪者，加重其刑至二分之一。", "id": 644}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "281", "title": "第 281 條", "content": "施強暴於直系血親尊親屬，未成傷者，處一年以下有期徒刑、拘役或十萬元以下罰金。", "id": 645}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "282", "title": "第 282 條", "content": "1 受他人囑託或得其承諾而傷害之，因而致死者，處六月以上五年以下有期徒刑；致重傷者，處三年以下有期徒刑。\n2 教唆或幫助他人使之自傷，因而致死者，處五年以下有期徒刑；致重傷者，處二年以下有期徒刑。", "id": 646}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "283", "title": "第 283 條", "content": "聚眾鬥毆致人於死或重傷者，在場助勢之人，處五年以下有期徒刑。", "id": 647}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "284", "title": "第 284 條", "content": "因過失傷害人者，處一年以下有期徒刑、拘役或十萬元以下罰金；致重傷者，處三年以下有期徒刑、拘役或三十萬元以下罰金。", "id": 648}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "285", "title": "第 285 條", "content": "（刪除）", "id": 649}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "286", "title": "第 286 條", "content": "1 對於未滿十八歲之人，施以凌虐或以他法足以妨害其身心之健全或發育者，處六月以上五年以下有期徒刑。\n2 意圖營利，而犯前項之罪者，處五年以上有期徒刑，得併科三百萬元以下罰金。\n3 對於未滿七歲之人，犯前二項之罪者，依各該項之規定加重其刑二分之一。\n4 對於七歲以上未滿十八歲之人，犯第一項之罪，因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n5 對於七歲以上未滿十八歲之人，犯第二項之罪，因而致人於死者，處無期徒刑或十二年以上有期徒刑；致重傷者，處十年以上有期徒刑。\n6 對於未滿七歲之人，犯第一項之罪，因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；\n致重傷者，處十年以上有期徒刑。\n7 對於未滿七歲之人，犯第二項之罪，因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；\n致重傷者，處無期徒刑或十二年以上有期徒刑。", "id": 650}, {"law": "中華民國刑法", "chapter": "第 二十三 章 傷害罪", "num": "287", "title": "第 287 條", "content": "第二百七十七條第一項、第二百八十一條及第二百八十四條之罪，須告訴乃論。但公務員於執行職務時，犯第二百七十七條第一項之罪者，不在此限。", "id": 651}, {"law": "中華民國刑法", "chapter": "第 二十四 章 墮胎罪", "num": "288", "title": "第 288 條", "content": "1 懷胎婦女服藥或以他法墮胎者，處六月以下有期徒刑、拘役或三千元以下罰金。\n2 懷胎婦女聽從他人墮胎者，亦同。\n3 因疾病或其他防止生命上危險之必要，而犯前二項之罪者，免除其刑。", "id": 652}, {"law": "中華民國刑法", "chapter": "第 二十四 章 墮胎罪", "num": "289", "title": "第 289 條", "content": "1 受懷胎婦女之囑託或得其承諾，而使之墮胎者，處二年以下有期徒刑。\n2 因而致婦女於死者，處六月以上五年以下有期徒刑。致重傷者，處三年以下有期徒刑。", "id": 653}, {"law": "中華民國刑法", "chapter": "第 二十四 章 墮胎罪", "num": "290", "title": "第 290 條", "content": "1 意圖營利而犯前條第一項之罪者，處六月以上五年以下有期徒刑，得併科一萬五千元以下罰金。\n2 因而致婦女於死者，處三年以上十年以下有期徒刑，得併科一萬五千元以下罰金；致重傷者，處一年以上七年以下有期徒刑，得併科一萬五千元以下罰金。", "id": 654}, {"law": "中華民國刑法", "chapter": "第 二十四 章 墮胎罪", "num": "291", "title": "第 291 條", "content": "1 未受懷胎婦女之囑託或未得其承諾，而使之墮胎者，處一年以上七年以下有期徒刑。\n2 因而致婦女於死者，處無期徒刑或七年以上有期徒刑。致重傷者，處三年以上十年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 655}, {"law": "中華民國刑法", "chapter": "第 二十四 章 墮胎罪", "num": "292", "title": "第 292 條", "content": "以文字、圖畫或他法，公然介紹墮胎之方法或物品，或公然介紹自己或他人為墮胎之行為者，處一年以下有期徒刑、拘役或科或併科三萬元以下罰金。", "id": 656}, {"law": "中華民國刑法", "chapter": "第 二十五 章 遺棄罪", "num": "293", "title": "第 293 條", "content": "1 遺棄無自救力之人者，處六月以下有期徒刑、拘役或三千元以下罰金。\n2 因而致人於死者，處五年以下有期徒刑；致重傷者，處三年以下有期徒刑。", "id": 657}, {"law": "中華民國刑法", "chapter": "第 二十五 章 遺棄罪", "num": "294", "title": "第 294 條", "content": "1 對於無自救力之人，依法令或契約應扶助、養育或保護而遺棄之，或不為其生存所必要之扶助、養育或保護者，處六月以上、五年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。", "id": 658}, {"law": "中華民國刑法", "chapter": "第 二十五 章 遺棄罪", "num": "294-1", "title": "第 294-1 條", "content": "對於無自救力之人，依民法親屬編應扶助、養育或保護，因有下列情形之一，而不為無自救力之人生存所必要之扶助、養育或保護者，不罰：\n一、無自救力之人前為最輕本刑六月以上有期徒刑之罪之行為，而侵害其生命、身體或自由者。\n二、無自救力之人前對其為第二百二十七條第三項、第二百二十八條第二項、第二百三十一條第一項、第二百八十六條之行為或人口販運防制法第三十二條、第三十三條之行為者。\n三、無自救力之人前侵害其生命、身體、自由，而故意犯前二款以外之罪，經判處逾六月有期徒刑確定者。\n四、無自救力之人前對其無正當理由未盡扶養義務持續逾二年，且情節重大者。", "id": 659}, {"law": "中華民國刑法", "chapter": "第 二十五 章 遺棄罪", "num": "295", "title": "第 295 條", "content": "對於直系血親尊親屬犯第二百九十四條之罪者，加重其刑至二分之一。", "id": 660}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "296", "title": "第 296 條", "content": "1 使人為奴隸或使人居於類似奴隸之不自由地位者，處一年以上七年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 661}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "296-1", "title": "第 296-1 條", "content": "1 買賣、質押人口者，處五年以上有期徒刑，得併科五十萬元以下罰金。\n2 意圖使人為性交或猥褻之行為而犯前項之罪者，處七年以上有期徒刑，得併科五十萬元以下罰金。\n3 以強暴、脅迫、恐嚇、監控、藥劑、催眠術或其他違反本人意願之方法犯前二項之罪者，加重其刑至二分之一。\n4 媒介、收受、藏匿前三項被買賣、質押之人或使之隱避者，處一年以上七年以下有期徒刑，得併科三十萬元以下罰金。\n5 公務員包庇他人犯前四項之罪者，依各該項之規定加重其刑至二分之一。\n6 第一項至第三項之未遂犯罰之。", "id": 662}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "297", "title": "第 297 條", "content": "1 意圖營利，以詐術使人出中華民國領域外者，處三年以上十年以下有期徒刑，得併科三十萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 663}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "298", "title": "第 298 條", "content": "1 意圖使婦女與自己或他人結婚而略誘之者，處五年以下有期徒刑。\n2 意圖營利、或意圖使婦女為猥褻之行為或性交而略誘之者，處一年以上七年以下有期徒刑，得併科三萬元以下罰金。\n3 前二項之未遂犯罰之。", "id": 664}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "299", "title": "第 299 條", "content": "1 移送前條被略誘人出中華民國領域外者，處五年以上有期徒刑。\n2 前項之未遂犯罰之。", "id": 665}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "300", "title": "第 300 條", "content": "1 意圖營利，或意圖使被略誘人為猥褻之行為或性交，而收受、藏匿被略誘人或使之隱避者，處六月以上五年以下有期徒刑，得併科一萬五千元以下罰金。\n2 前項之未遂犯罰之。", "id": 666}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "301", "title": "第 301 條", "content": "犯第二百九十八條至第三百條之罪，於裁判宣告前，送回被誘人或指明所在地因而尋獲者，得減輕其刑。", "id": 667}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "302", "title": "第 302 條", "content": "1 私行拘禁或以其他非法方法，剝奪人之行動自由者，處五年以下有期徒刑、拘役或九千元以下罰金。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑；致重傷者，處三年以上十年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 668}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "302-1", "title": "第 302-1 條", "content": "1 犯前條第一項之罪而有下列情形之一者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金：\n一、三人以上共同犯之。\n二、攜帶兇器犯之。\n三、對精神、身體障礙或其他心智缺陷之人犯之。\n四、對被害人施以凌虐。\n五、剝奪被害人行動自由七日以上。\n2 因而致人於死者，處無期徒刑或十年以上有期徒刑；致重傷者，處五年以上十二年以下有期徒刑。\n3 第一項第一款至第四款之未遂犯罰之。", "id": 669}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "303", "title": "第 303 條", "content": "對於直系血親尊親屬犯前二條第一項或第二項之罪者，加重其刑至二分之一。", "id": 670}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "304", "title": "第 304 條", "content": "1 以強暴、脅迫使人行無義務之事或妨害人行使權利者，處三年以下有期徒刑、拘役或九千元以下罰金。\n2 前項之未遂犯罰之。", "id": 671}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "305", "title": "第 305 條", "content": "以加害生命、身體、自由、名譽、財產之事恐嚇他人，致生危害於安全者，處二年以下有期徒刑、拘役或九千元以下罰金。", "id": 672}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "306", "title": "第 306 條", "content": "1 無故侵入他人住宅、建築物或附連圍繞之土地或船艦者，處一年以下有期徒刑、拘役或九千元以下罰金。\n2 無故隱匿其內，或受退去之要求而仍留滯者，亦同。", "id": 673}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "307", "title": "第 307 條", "content": "不依法令搜索他人身體、住宅、建築物、舟、車或航空機者，處二年以下有期徒刑、拘役或九千元以下罰金。", "id": 674}, {"law": "中華民國刑法", "chapter": "第 二十六 章 妨害自由罪", "num": "308", "title": "第 308 條", "content": "1 第二百九十八條及第三百零六條之罪，須告訴乃論。\n2 第二百九十八條第一項之罪，其告訴以不違反被略誘人之意思為限。", "id": 675}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "309", "title": "第 309 條", "content": "1 公然侮辱人者，處拘役或九千元以下罰金。\n2 以強暴犯前項之罪者，處一年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 676}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "310", "title": "第 310 條", "content": "1 意圖散布於眾，而指摘或傳述足以毀損他人名譽之事者，為誹謗罪，處一年以下有期徒刑、拘役或一萬五千元以下罰金。\n2 散布文字、圖畫犯前項之罪者，處二年以下有期徒刑、拘役或三萬元以下罰金。\n3 對於所誹謗之事，能證明其為真實者，不罰。但涉於私德而與公共利益無關者，不在此限。", "id": 677}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "311", "title": "第 311 條", "content": "以善意發表言論，而有左列情形之一者，不罰：\n一、因自衛、自辯或保護合法之利益者。\n二、公務員因職務而報告者。\n三、對於可受公評之事，而為適當之評論者。\n四、對於中央及地方之會議或法院或公眾集會之記事，而為適當之載述者。", "id": 678}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "312", "title": "第 312 條", "content": "1 對於已死之人公然侮辱者，處拘役或九千元以下罰金。\n2 對於已死之人犯誹謗罪者，處一年以下有期徒刑、拘役或三萬元以下罰金。", "id": 679}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "313", "title": "第 313 條", "content": "1 散布流言或以詐術損害他人之信用者，處二年以下有期徒刑、拘役或科或併科二十萬元以下罰金。\n2 以廣播電視、電子通訊、網際網路或其他傳播工具犯前項之罪者，得加重其刑至二分之一。", "id": 680}, {"law": "中華民國刑法", "chapter": "第 二十七 章 妨害名譽及信用罪", "num": "314", "title": "第 314 條", "content": "本章之罪，須告訴乃論。", "id": 681}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "315", "title": "第 315 條", "content": "無故開拆或隱匿他人之封緘信函、文書或圖畫者，處拘役或九千元以下罰金。無故以開拆以外之方法，窺視其內容者，亦同。", "id": 682}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "315-1", "title": "第 315-1 條", "content": "有下列行為之一者，處三年以下有期徒刑、拘役或三十萬元以下罰金：\n一、無故利用工具或設備窺視、竊聽他人非公開之活動、言論、談話或身體隱私部位者。\n二、無故以錄音、照相、錄影或電磁紀錄竊錄他人非公開之活動、言論、談話或身體隱私部位者。", "id": 683}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "315-2", "title": "第 315-2 條", "content": "1 意圖營利供給場所、工具或設備，便利他人為前條之行為者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 意圖散布、播送、販賣而有前條第二款之行為者，亦同。\n3 製造、散布、播送或販賣前二項或前條第二款竊錄之內容者，依第一項之規定處斷。\n4 前三項之未遂犯罰之。", "id": 684}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "315-3", "title": "第 315-3 條", "content": "前二條竊錄內容之附著物及物品，不問屬於犯人與否，沒收之。", "id": 685}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "316", "title": "第 316 條", "content": "醫師、藥師、藥商、助產士、心理師、宗教師、律師、辯護人、公證人、會計師或其業務上佐理人，或曾任此等職務之人，無故洩漏因業務知悉或持有之他人秘密者，處一年以下有期徒刑、拘役或五萬元以下罰金。", "id": 686}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "317", "title": "第 317 條", "content": "依法令或契約有守因業務知悉或持有工商秘密之義務而無故洩漏之者，處一年以下有期徒刑、拘役或三萬元以下罰金。", "id": 687}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "318", "title": "第 318 條", "content": "公務員或曾任公務員之人，無故洩漏因職務知悉或持有他人之工商秘密者，處二年以下有期徒刑、拘役或六萬元以下罰金。", "id": 688}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "318-1", "title": "第 318-1 條", "content": "無故洩漏因利用電腦或其他相關設備知悉或持有他人之秘密者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 689}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "318-2", "title": "第 318-2 條", "content": "利用電腦或其相關設備犯第三百十六條至第三百十八條之罪者，加重其刑至二分之一。", "id": 690}, {"law": "中華民國刑法", "chapter": "第 二十八 章 妨害秘密罪", "num": "319", "title": "第 319 條", "content": "第三百十五條、第三百十五條之一及第三百十六條至第三百十八條之二之罪，須告訴乃論。", "id": 691}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-1", "title": "第 319-1 條", "content": "1 未經他人同意，無故以照相、錄影、電磁紀錄或其他科技方法攝錄其性影像者，處三年以下有期徒刑。\n2 意圖營利供給場所、工具或設備，便利他人為前項之行為者，處五年以下有期徒刑，得併科五十萬元以下罰金。\n3 意圖營利、散布、播送、公然陳列或以他法供人觀覽，而犯第一項之罪者，依前項規定處斷。\n4 前三項之未遂犯罰之。", "id": 692}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-2", "title": "第 319-2 條", "content": "1 以強暴、脅迫、恐嚇或其他違反本人意願之方法，以照相、錄影、電磁紀錄或其他科技方法攝錄其性影像，或使其本人攝錄者，處五年以下有期徒刑，得併科五十萬元以下罰金。\n2 意圖營利供給場所、工具或設備，便利他人為前項之行為者，處六月以上五年以下有期徒刑，得併科五十萬元以下罰金。\n3 意圖營利、散布、播送、公然陳列或以他法供人觀覽，而犯第一項之罪者，依前項規定處斷。\n4 前三項之未遂犯罰之。", "id": 693}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-3", "title": "第 319-3 條", "content": "1 未經他人同意，無故重製、散布、播送、交付、公然陳列，或以他法供人觀覽其性影像者，處五年以下有期徒刑，得併科五十萬元以下罰金。\n2 犯前項之罪，其性影像係第三百十九條之一第一項至第三項攝錄之內容者，處六月以上五年以下有期徒刑，得併科五十萬元以下罰金。\n3 犯第一項之罪，其性影像係前條第一項至第三項攝錄之內容者，處一年以上七年以下有期徒刑，得併科七十萬元以下罰金。\n4 意圖營利而犯前三項之罪者，依各該項之規定，加重其刑至二分之一。販賣前三項性影像者，亦同。\n5 前四項之未遂犯罰之。", "id": 694}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-4", "title": "第 319-4 條", "content": "1 意圖散布、播送、交付、公然陳列，或以他法供人觀覽，以電腦合成或其他科技方法製作關於他人不實之性影像，足以生損害於他人者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 散布、播送、交付、公然陳列，或以他法供人觀覽前項性影像，足以生損害於他人者，亦同。\n3 意圖營利而犯前二項之罪者，處七年以下有期徒刑，得併科七十萬元以下罰金。販賣前二項性影像者，亦同。", "id": 695}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-5", "title": "第 319-5 條", "content": "第三百十九條之一至前條性影像之附著物及物品，不問屬於犯罪行為人與否，沒收之。", "id": 696}, {"law": "中華民國刑法", "chapter": "第 二十八 章之一 妨害性隱私及不實性影像罪", "num": "319-6", "title": "第 319-6 條", "content": "第三百十九條之一第一項及其未遂犯、第三百十九條之三第一項及其未遂犯之罪，須告訴乃論。", "id": 697}, {"law": "中華民國刑法", "chapter": "第 二十九 章 竊盜罪", "num": "320", "title": "第 320 條", "content": "1 意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盜罪，處五年以下有期徒刑、拘役或五十萬元以下罰金。\n2 意圖為自己或第三人不法之利益，而竊佔他人之不動產者，依前項之規定處斷。\n3 前二項之未遂犯罰之。", "id": 698}, {"law": "中華民國刑法", "chapter": "第 二十九 章 竊盜罪", "num": "321", "title": "第 321 條", "content": "1 犯前條第一項、第二項之罪而有下列情形之一者，處六月以上五年以下有期徒刑，得併科五十萬元以下罰金：\n一、侵入住宅或有人居住之建築物、船艦或隱匿其內而犯之。\n二、毀越門窗、牆垣或其他安全設備而犯之。\n三、攜帶兇器而犯之。\n四、結夥三人以上而犯之。\n五、乘火災、水災或其他災害之際而犯之。\n六、在車站、港埠、航空站或其他供水、陸、空公眾運輸之舟、車、航空機內而犯之。\n2 前項之未遂犯罰之。", "id": 699}, {"law": "中華民國刑法", "chapter": "第 二十九 章 竊盜罪", "num": "322", "title": "第 322 條", "content": "（刪除）", "id": 700}, {"law": "中華民國刑法", "chapter": "第 二十九 章 竊盜罪", "num": "323", "title": "第 323 條", "content": "電能、熱能及其他能量，關於本章之罪，以動產論。", "id": 701}, {"law": "中華民國刑法", "chapter": "第 二十九 章 竊盜罪", "num": "324", "title": "第 324 條", "content": "1 於直系血親、配偶或同財共居親屬之間，犯本章之罪者，得免除其刑。\n2 前項親屬或其他五親等內血親或三親等內姻親之間，犯本章之罪者，須告訴乃論。", "id": 702}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "325", "title": "第 325 條", "content": "1 意圖為自己或第三人不法之所有，而搶奪他人之動產者，處六月以上五年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑，致重傷者，處三年以上十年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 703}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "326", "title": "第 326 條", "content": "1 犯前條第一項之罪，而有第三百二十一條第一項各款情形之一者，處一年以上七年以下有期徒刑。\n2 前項之未遂犯罰之。", "id": 704}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "327", "title": "第 327 條", "content": "（刪除）", "id": 705}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "328", "title": "第 328 條", "content": "1 意圖為自己或第三人不法之所有，以強暴、脅迫、藥劑、催眠術或他法，至使不能抗拒，而取他人之物或使其交付者，為強盜罪，處五年以上有期徒刑。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 犯強盜罪因而致人於死者，處死刑、無期徒刑或十年以上有期徒刑；致重傷者，處無期徒刑或七年以上有期徒刑。\n4 第一項及第二項之未遂犯罰之。\n5 預備犯強盜罪者，處一年以下有期徒刑、拘役或九千元以下罰金。", "id": 706}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "329", "title": "第 329 條", "content": "竊盜或搶奪，因防護贓物、脫免逮捕或湮滅罪證，而當場施以強暴脅迫者，以強盜論。", "id": 707}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "330", "title": "第 330 條", "content": "1 犯強盜罪而有第三百二十一條第一項各款情形之一者，處七年以上有期徒刑。\n2 前項之未遂犯罰之。", "id": 708}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "331", "title": "第 331 條", "content": "（刪除）", "id": 709}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "332", "title": "第 332 條", "content": "1 犯強盜罪而故意殺人者，處死刑或無期徒刑。\n2 犯強盜罪而有下列行為之一者，處死刑、無期徒刑或十年以上有期徒刑：\n一、放火者。\n二、強制性交者。\n三、擄人勒贖者。\n四、使人受重傷者。", "id": 710}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "333", "title": "第 333 條", "content": "1 未受交戰國之允准或不屬於各國之海軍，而駕駛船艦，意圖施強暴、脅迫於他船或他船之人或物者，為海盜罪，處死刑、無期徒刑或七年以上有期徒刑。\n2 船員或乘客意圖掠奪財物，施強暴、脅迫於其他船員或乘客，而駕駛或指揮船艦者，以海盜論。\n3 因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處死刑、無期徒刑或十年以上有期徒刑。", "id": 711}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "334", "title": "第 334 條", "content": "1 犯海盜罪而故意殺人者，處死刑或無期徒刑。\n2 犯海盜罪而有下列行為之一，處死刑、無期徒刑或十二年以上有期徒刑：\n一、放火者。\n二、強制性交者。\n三、擄人勒贖者。\n四、使人受重傷者。", "id": 712}, {"law": "中華民國刑法", "chapter": "第 三十 章 搶奪強盜及海盜罪", "num": "334-1", "title": "第 334-1 條", "content": "第三百二十三條之規定，於本章之罪準用之。", "id": 713}, {"law": "中華民國刑法", "chapter": "第 三十一 章 侵占罪", "num": "335", "title": "第 335 條", "content": "1 意圖為自己或第三人不法之所有，而侵占自己持有他人之物者，處五年以下有期徒刑、拘役或科或併科三萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 714}, {"law": "中華民國刑法", "chapter": "第 三十一 章 侵占罪", "num": "336", "title": "第 336 條", "content": "1 對於公務上或因公益所持有之物，犯前條第一項之罪者，處一年以上七年以下有期徒刑，得併科十五萬元以下罰金。\n2 對於業務上所持有之物，犯前條第一項之罪者，處六月以上五年以下有期徒刑，得併科九萬元以下罰金。\n3 前二項之未遂犯罰之。", "id": 715}, {"law": "中華民國刑法", "chapter": "第 三十一 章 侵占罪", "num": "337", "title": "第 337 條", "content": "意圖為自己或第三人不法之所有，而侵占遺失物、漂流物或其他離本人所持有之物者，處一萬五千元以下罰金。", "id": 716}, {"law": "中華民國刑法", "chapter": "第 三十一 章 侵占罪", "num": "338", "title": "第 338 條", "content": "第三百二十三條及第三百二十四條之規定，於本章之罪準用之。", "id": 717}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "339", "title": "第 339 條", "content": "1 意圖為自己或第三人不法之所有，以詐術使人將本人或第三人之物交付者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 718}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "339-1", "title": "第 339-1 條", "content": "1 意圖為自己或第三人不法之所有，以不正方法由收費設備取得他人之物者，處一年以下有期徒刑、拘役或十萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 719}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "339-2", "title": "第 339-2 條", "content": "1 意圖為自己或第三人不法之所有，以不正方法由自動付款設備取得他人之物者，處三年以下有期徒刑、拘役或三十萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 720}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "339-3", "title": "第 339-3 條", "content": "1 意圖為自己或第三人不法之所有，以不正方法將虛偽資料或不正指令輸入電腦或其相關設備，製作財產權之得喪、變更紀錄，而取得他人之財產者，處七年以下有期徒刑，得併科七十萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 721}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "339-4", "title": "第 339-4 條", "content": "1 犯第三百三十九條詐欺罪而有下列情形之一者，處一年以上七年以下有期徒刑，得併科一百萬元以下罰金：\n一、冒用政府機關或公務員名義犯之。\n二、三人以上共同犯之。\n三、以廣播電視、電子通訊、網際網路或其他媒體等傳播工具，對公眾散布而犯之。\n四、以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄之方法犯之。\n2 前項之未遂犯罰之。", "id": 722}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "340", "title": "第 340 條", "content": "（刪除）", "id": 723}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "341", "title": "第 341 條", "content": "1 意圖為自己或第三人不法之所有，乘未滿十八歲人之知慮淺薄，或乘人精神障礙、心智缺陷而致其辨識能力顯有不足或其他相類之情形，使之將本人或第三人之物交付者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 724}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "342", "title": "第 342 條", "content": "1 為他人處理事務，意圖為自己或第三人不法之利益，或損害本人之利益，而為違背其任務之行為，致生損害於本人之財產或其他利益者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 725}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "343", "title": "第 343 條", "content": "第三百二十三條及第三百二十四條之規定，於第三百三十九條至前條之罪準用之。", "id": 726}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "344", "title": "第 344 條", "content": "1 乘他人急迫、輕率、無經驗或難以求助之處境，貸以金錢或其他物品，而取得與原本顯不相當之重利者，處三年以下有期徒刑、拘役或科或併科三十萬元以下罰金。\n2 前項重利，包括手續費、保管費、違約金及其他與借貸相關之費用。", "id": 727}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "344-1", "title": "第 344-1 條", "content": "1 以強暴、脅迫、恐嚇、侵入住宅、傷害、毀損、監控或其他足以使人心生畏懼之方法取得前條第一項之重利者，處六月以上五年以下有期徒刑，得併科五十萬元以下罰金。\n2 前項之未遂犯罰之。", "id": 728}, {"law": "中華民國刑法", "chapter": "第 三十二 章 詐欺背信及重利罪", "num": "345", "title": "第 345 條", "content": "（刪除）", "id": 729}, {"law": "中華民國刑法", "chapter": "第 三十三 章 恐嚇及擄人勒贖罪", "num": "346", "title": "第 346 條", "content": "1 意圖為自己或第三人不法之所有，以恐嚇使人將本人或第三人之物交付者，處六月以上五年以下有期徒刑，得併科三萬元以下罰金。\n2 以前項方法得財產上不法之利益或使第三人得之者，亦同。\n3 前二項之未遂犯罰之。", "id": 730}, {"law": "中華民國刑法", "chapter": "第 三十三 章 恐嚇及擄人勒贖罪", "num": "347", "title": "第 347 條", "content": "1 意圖勒贖而擄人者，處無期徒刑或七年以上有期徒刑。\n2 因而致人於死者，處死刑、無期徒刑或十二年以上有期徒刑；致重傷者，處無期徒刑或十年以上有期徒刑。\n3 第一項之未遂犯罰之。\n4 預備犯第一項之罪者，處二年以下有期徒刑。\n5 犯第一項之罪，未經取贖而釋放被害人者，減輕其刑；取贖後而釋放被害人者，得減輕其刑。", "id": 731}, {"law": "中華民國刑法", "chapter": "第 三十三 章 恐嚇及擄人勒贖罪", "num": "348", "title": "第 348 條", "content": "1 犯前條第一項之罪而故意殺人者，處死刑或無期徒刑。\n2 犯前條第一項之罪而有下列行為之一者，處死刑、無期徒刑或十二年以上有期徒刑：\n一、強制性交者。\n二、使人受重傷者。", "id": 732}, {"law": "中華民國刑法", "chapter": "第 三十三 章 恐嚇及擄人勒贖罪", "num": "348-1", "title": "第 348-1 條", "content": "擄人後意圖勒贖者，以意圖勒贖而擄人論。", "id": 733}, {"law": "中華民國刑法", "chapter": "第 三十四 章 贓物罪", "num": "349", "title": "第 349 條", "content": "1 收受、搬運、寄藏、故買贓物或媒介者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。\n2 因贓物變得之財物，以贓物論。", "id": 734}, {"law": "中華民國刑法", "chapter": "第 三十四 章 贓物罪", "num": "350", "title": "第 350 條", "content": "（刪除）", "id": 735}, {"law": "中華民國刑法", "chapter": "第 三十四 章 贓物罪", "num": "351", "title": "第 351 條", "content": "於直系血親、配偶或同財共居親屬之間，犯本章之罪者，得免除其刑。", "id": 736}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "352", "title": "第 352 條", "content": "毀棄、損壞他人文書或致令不堪用，足以生損害於公眾或他人者，處三年以下有期徒刑、拘役或三萬元以下罰金。", "id": 737}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "353", "title": "第 353 條", "content": "1 毀壞他人建築物、礦坑、船艦或致令不堪用者，處六月以上五年以下有期徒刑。\n2 因而致人於死者，處無期徒刑或七年以上有期徒刑，致重傷者，處三年以上十年以下有期徒刑。\n3 第一項之未遂犯罰之。", "id": 738}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "354", "title": "第 354 條", "content": "毀棄、損壞前二條以外之他人之物或致令不堪用，足以生損害於公眾或他人者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 739}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "355", "title": "第 355 條", "content": "意圖損害他人，以詐術使本人或第三人為財產上之處分，致生財產上之損害者，處三年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 740}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "356", "title": "第 356 條", "content": "債務人於將受強制執行之際，意圖損害債權人之債權，而毀壞、處分或隱匿其財產者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。", "id": 741}, {"law": "中華民國刑法", "chapter": "第 三十五 章 毀棄損壞罪", "num": "357", "title": "第 357 條", "content": "第三百五十二條、第三百五十四條至第三百五十六條之罪，須告訴乃論。", "id": 742}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "358", "title": "第 358 條", "content": "無故輸入他人帳號密碼、破解使用電腦之保護措施或利用電腦系統之漏洞，而入侵他人之電腦或其相關設備者，處三年以下有期徒刑、拘役或科或併科三十萬元以下罰金。", "id": 743}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "359", "title": "第 359 條", "content": "無故取得、刪除或變更他人電腦或其相關設備之電磁紀錄，致生損害於公眾或他人者，處五年以下有期徒刑、拘役或科或併科六十萬元以下罰金。", "id": 744}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "360", "title": "第 360 條", "content": "無故以電腦程式或其他電磁方式干擾他人電腦或其相關設備，致生損害於公眾或他人者，處三年以下有期徒刑、拘役或科或併科三十萬元以下罰金。", "id": 745}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "361", "title": "第 361 條", "content": "對於公務機關之電腦或其相關設備犯前三條之罪者，加重其刑至二分之一。", "id": 746}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "362", "title": "第 362 條", "content": "製作專供犯本章之罪之電腦程式，而供自己或他人犯本章之罪，致生損害於公眾或他人者，處五年以下有期徒刑、拘役或科或併科六十萬元以下罰金。", "id": 747}, {"law": "中華民國刑法", "chapter": "第 三十六 章 妨害電腦使用罪", "num": "363", "title": "第 363 條", "content": "第三百五十八
